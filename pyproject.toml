[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nixos-nas-control"
dynamic = ["version"]
description = "NixOS NAS appliance control-plane commands"
requires-python = ">=3.12"

[project.scripts]
nas-ai-config = "nas_ai_config:main"
nas-alert-router = "nas_alert_router:main"
nas-authentik-v2-groups = "nas_authentik_v2_groups:main"
nas-backup-v2 = "nas_backup_v2:main"
nas-cockpit-api = "nas_cockpit_api:main"
nas-code-agent = "nas_coding_agent:main"
nas-copyparty-projection = "nas_copyparty_projection:main"
nas-doctor = "nas_doctor:main"
nas-feature-control = "nas_feature_control_v2:main"
nas-identity-sync = "nas_identity_sync:main"
nas-managed-service = "nas_managed_service_dependencies:main"
nas-migrate-state = "nas_migrate_state:main"
nas-operation-run = "nas_operation_lock:main"
nas-setup = "nas_setup:main"
nas-state = "nas_state:main"

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools]
package-dir = {"" = "services"}
py-modules = [
  "nas_ai_config",
  "nas_alert_router",
  "nas_authentik_v2_groups",
  "nas_backup_v2",
  "nas_common",
  "nas_cockpit_api",
  "nas_coding_agent",
  "nas_copyparty_projection",
  "nas_doctor",
  "nas_feature_control",
  "nas_feature_control_v2",
  "nas_feature_model",
  "nas_identity_model",
  "nas_identity_sync",
  "nas_logging",
  "nas_managed_network",
  "nas_managed_resources",
  "nas_managed_service",
  "nas_managed_service_v2",
  "nas_managed_service_dependencies",
  "nas_migrate_state",
  "nas_operation_journal",
  "nas_operation_lock",
  "nas_setup",
  "nas_setup_config",
  "nas_state",
  "nas_syncthing_devices"
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/fuzz.py" = ["E402"]
"tests/slow_managed_service_stateful.py" = ["E402"]
"tests/test_adversarial_security.py" = ["E402"]
"tests/test_alert_router.py" = ["E402"]
"tests/test_capability_registry.py" = ["E402"]
"tests/test_coding_agent.py" = ["E402"]
"tests/test_common.py" = ["E402"]
"tests/test_disabled_service_caddy.py" = ["E402"]
"tests/test_doctor_migrations.py" = ["E402"]
"tests/test_fuzz_boundaries.py" = ["E402"]
"tests/test_logging.py" = ["E402"]
"tests/test_managed_service_hardening.py" = ["E402"]
"tests/test_managed_service_stateful.py" = ["E402"]
"tests/test_property_invariants.py" = ["F401"]
"tests/test_secret_security_fuzz.py" = ["E402"]
"tests/test_secret_subprocess_redaction.py" = ["E402"]
"tests/test_security_surface.py" = ["E402"]
"tests/test_service_caddy.py" = ["E402"]
"tests/test_service_caddy_validate.py" = ["E402"]
"tests/test_syncthing_devices.py" = ["E402"]

[tool.pyright]
include = ["services", "scripts", "tests"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "none"
reportMissingTypeStubs = "none"