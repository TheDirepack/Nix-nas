[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nixos-nas-control"
dynamic = ["version"]
description = "NixOS NAS appliance control-plane commands"
requires-python = ">=3.12"

[project.scripts]
nas-ai-config = "nas_ai_config:main"
nas-alert-router = "nas_alert_router:main"
nas-cockpit-api = "nas_cockpit_api:main"
nas-code-agent = "nas_coding_agent:main"
nas-doctor = "nas_doctor:main"
nas-identity-sync = "nas_identity_sync:main"
nas-managed-services = "nas_v2_cli:main"
nas-managed-services-control = "nas_v2_control:main"
nas-managed-session = "nas_v2_session:main"
nas-operation-run = "nas_operation_lock:main"
nas-setup = "nas_setup:main"
nas-state = "nas_state:main"

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools]
package-dir = {"" = "services"}
py-modules = [
  "nas_ai_config",
  "nas_alert_router",
  "nas_common",
  "nas_cockpit_api",
  "nas_coding_agent",
  "nas_doctor",
  "nas_identity_model",
  "nas_identity_sync",
  "nas_logging",
  "nas_operation_journal",
  "nas_operation_lock",
  "nas_setup",
  "nas_setup_config",
  "nas_state",
  "nas_syncthing_devices",
  "nas_v2_accelerator",
  "nas_v2_apply",
  "nas_v2_authentik",
  "nas_v2_backup",
  "nas_v2_backup_runtime",
  "nas_v2_bootstrap",
  "nas_v2_caddy",
  "nas_v2_cli",
  "nas_v2_compose",
  "nas_v2_control",
  "nas_v2_editor",
  "nas_v2_exec_runner",
  "nas_v2_firewalld",
  "nas_v2_firewalld_reconcile",
  "nas_v2_libvirt",
  "nas_v2_native_dump",
  "nas_v2_plan",
  "nas_v2_platform_probe",
  "nas_v2_podman_network",
  "nas_v2_portal",
  "nas_v2_python_prepare",
  "nas_v2_quadlet",
  "nas_v2_readiness",
  "nas_v2_session",
  "nas_v2_session_projection",
  "nas_v2_source_watch",
  "nas_v2_spec",
  "nas_v2_systemd",
  "nas_v2_systemd_attachments",
  "nas_v2_systemd_reconcile",
  "nas_v2_wake"
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# These harnesses intentionally add the repository service/test directories to
# sys.path before importing NAS-owned modules. Keep E402 scoped to only those
# bootstrap files so ordinary modules still enforce top-level import ordering.
[tool.ruff.lint.per-file-ignores]
"scripts/fuzz.py" = ["E402"]
"tests/test_adversarial_security.py" = ["E402"]
"tests/test_alert_router.py" = ["E402"]
"tests/test_coding_agent.py" = ["E402"]
"tests/test_common.py" = ["E402"]
"tests/test_doctor.py" = ["E402"]
"tests/test_fuzz_boundaries.py" = ["E402"]
"tests/test_logging.py" = ["E402"]
"tests/test_secret_security_fuzz.py" = ["E402"]
"tests/test_secret_subprocess_redaction.py" = ["E402"]
"tests/test_security_surface.py" = ["E402"]
"tests/test_syncthing_devices.py" = ["E402"]

[tool.pyright]
include = ["services", "scripts", "tests"]
exclude = ["**/__pycache__"]
