# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: NAS Setup
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.application
    identifiers:
      slug: nas-setup
    attrs:
      name: NAS Setup
      group: NAS Setup
      metaDescription: First-run setup wizard – create the administrator and review storage.
      metaPublisher: NAS
      openInNewTab: false
      provider: null

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, nas-setup]]
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, nas_admin]]
      enabled: true
      negate: false
