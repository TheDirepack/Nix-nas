<!DOCTYPE html>
<html>
<head>
  <title>NAS Setup</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="/setup">
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    .setup-form { background: #f0f0f0; padding: 20px; border-radius: 8px; margin-top: 20px; }
    input, button { padding: 10px; margin: 10px 0; width: 100%; }
    button { background: #0066cc; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>NAS Setup</h1>
  <p>This is the setup page for your NAS instance.</p>
  <div class="setup-form" style="background:#1b1b1b; border:1px solid #444; color:#eee;">
    <p>First-run setup is performed in the system console (Cockpit).</p>
    <a href="/console/" style="display:block; text-align:center; padding:12px; background:#0066cc; color:white; text-decoration:none; border-radius:6px; font-weight:600;">Open Console Setup</a>
    <p style="margin-top:1rem;"><small>VM default: <code>admin</code> / <code>admin-vm-password</code> or <code>nas-bootstrap</code> / <code>nixos-nas-bootstrap</code>.</small></p>
  </div>
</body>
</html>
