rules:
  - id: nas-python-shell-true
    languages: [python]
    severity: ERROR
    message: NAS-owned Python must not invoke subprocesses through a shell.
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: nas-python-eval-exec
    languages: [python]
    severity: ERROR
    message: Dynamic code execution is forbidden in privileged NAS Python.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: nas-python-sql-fstring
    languages: [python]
    severity: ERROR
    message: SQL statements must not be constructed with f-strings.
    pattern-either:
      - pattern: $DB.execute(f"...")
      - pattern: $DB.executemany(f"...")
      - pattern: $DB.executescript(f"...")

  - id: nas-python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Unsafe Python deserialization is forbidden in NAS-owned code.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: marshal.load(...)
      - pattern: marshal.loads(...)

  - id: nas-python-insecure-tempfile
    languages: [python]
    severity: ERROR
    message: tempfile.mktemp is race-prone; use a securely created temporary file or directory.
    pattern: tempfile.mktemp(...)

  - id: nas-python-bulk-archive-extract
    languages: [python]
    severity: WARNING
    message: Bulk archive extraction requires an explicit reviewed traversal guard.
    pattern: $ARCHIVE.extractall(...)

  - id: nas-react-dangerous-html
    languages: [javascript, typescript]
    severity: ERROR
    message: NAS UI must rely on React escaping rather than dangerous raw HTML sinks.
    pattern-either:
      - pattern: $EL.innerHTML = $VALUE
      - pattern: $EL.outerHTML = $VALUE
      - pattern: $EL.insertAdjacentHTML(...)
      - pattern: document.write(...)
      - pattern: document.writeln(...)
      - pattern: eval(...)
      - pattern: Function(...)
      - pattern: $EL.srcdoc = $VALUE
      - pattern: $EL.setAttribute("srcdoc", $VALUE)
      - pattern: $EL.setAttribute("on$EVENT", $VALUE)

  - id: nas-python-sql-parameterized-call
    languages: [python]
    severity: WARNING
    message: Parameterized SQL call with a non-literal query; verify the query string is not assembled from unsanitized input.
    # Only non-literal queries are reviewable: a constant statement with bound
    # parameters (for example execute("PRAGMA integrity_check")) has no
    # interpolation surface and a second argument proves parameters are bound.
    patterns:
      - pattern-either:
          - pattern: $DB.execute($QUERY, $PARAMS, ...)
          - pattern: $DB.executemany($QUERY, $PARAMS, ...)
      - pattern-not: $DB.execute("...", $PARAMS, ...)
      - pattern-not: $DB.executemany("...", $PARAMS, ...)

  - id: nas-react-dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: ERROR
    message: React dangerouslySetInnerHTML inserts raw HTML and can cause XSS; avoid it or sanitize the value.
    pattern-either:
      # Match the JSX attribute only; the nested object literal is not a valid
      # semgrep pattern for JavaScript.
      - pattern: '<$TAG ... dangerouslySetInnerHTML={$PROPS} ... />'

  - id: nas-dom-setattribute-event-handler
    languages: [javascript, typescript]
    severity: ERROR
    message: Assigning an event handler through setAttribute can execute attacker-controlled code.
    pattern-either:
      - pattern: $EL.setAttribute("onclick", $VALUE)
      - pattern: $EL.setAttribute("ondblclick", $VALUE)
      - pattern: $EL.setAttribute("onmousedown", $VALUE)
      - pattern: $EL.setAttribute("onmouseup", $VALUE)
      - pattern: $EL.setAttribute("onmouseover", $VALUE)
      - pattern: $EL.setAttribute("onmousemove", $VALUE)
      - pattern: $EL.setAttribute("onmouseout", $VALUE)
      - pattern: $EL.setAttribute("onmouseenter", $VALUE)
      - pattern: $EL.setAttribute("onmouseleave", $VALUE)
      - pattern: $EL.setAttribute("onkeydown", $VALUE)
      - pattern: $EL.setAttribute("onkeyup", $VALUE)
      - pattern: $EL.setAttribute("onkeypress", $VALUE)
      - pattern: $EL.setAttribute("onload", $VALUE)
      - pattern: $EL.setAttribute("onerror", $VALUE)
      - pattern: $EL.setAttribute("onabort", $VALUE)
      - pattern: $EL.setAttribute("onchange", $VALUE)
      - pattern: $EL.setAttribute("onsubmit", $VALUE)
      - pattern: $EL.setAttribute("onreset", $VALUE)
      - pattern: $EL.setAttribute("onselect", $VALUE)
      - pattern: $EL.setAttribute("onfocus", $VALUE)
      - pattern: $EL.setAttribute("onblur", $VALUE)
      - pattern: $EL.setAttribute("oninput", $VALUE)
      - pattern: $EL.setAttribute("oninvalid", $VALUE)
      - pattern: $EL.setAttribute("onscroll", $VALUE)
      - pattern: $EL.setAttribute("onwheel", $VALUE)
      - pattern: $EL.setAttribute("oncontextmenu", $VALUE)
      - pattern: $EL.setAttribute("oncopy", $VALUE)
      - pattern: $EL.setAttribute("oncut", $VALUE)
      - pattern: $EL.setAttribute("onpaste", $VALUE)
