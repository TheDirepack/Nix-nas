name: Prepare reusable Nix VM handoff
description: Restore granular cross-run caches, build missing roots once, and publish one complete per-run handoff artifact.

inputs:
  cache-schema:
    description: CI cache schema prefix
    required: true
  cache-suffix:
    description: Optional isolated cache namespace suffix
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve reusable Nix bundle keys
      id: keys
      shell: bash
      run: ./scripts/vm-bundles.sh keys >> "$GITHUB_OUTPUT"

    # Keep granular cross-run caches so a change in one application does not
    # invalidate the large stable core. These caches are acceleration only;
    # consumers never restore them directly.
    - name: "Restore bundle cache: core"
      id: core
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/core.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-core-${{ steps.keys.outputs.key_core }}${{ inputs.cache-suffix }}
    - name: "Restore bundle cache: identity"
      id: identity
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/identity.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-identity-${{ steps.keys.outputs.key_identity }}${{ inputs.cache-suffix }}
    - name: "Restore bundle cache: observability"
      id: observability
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/observability.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-observability-${{ steps.keys.outputs.key_observability }}${{ inputs.cache-suffix }}
    - name: "Restore bundle cache: storage"
      id: storage
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/storage.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-storage-${{ steps.keys.outputs.key_storage }}${{ inputs.cache-suffix }}
    - name: "Restore bundle cache: ai"
      id: ai
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/ai.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-ai-${{ steps.keys.outputs.key_ai }}${{ inputs.cache-suffix }}
    - name: "Restore bundle cache: VM drivers"
      id: vm_drivers
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/vm-drivers.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-vm-drivers-${{ steps.keys.outputs.key_vm_drivers }}${{ inputs.cache-suffix }}

    - name: Assemble reusable package bundles
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/vm-bundles"
        echo "::group::Import restored bundle fragments"
        ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
        echo "::endgroup::"
        echo "::group::Build and export only missing bundle fragments"
        ./scripts/vm-bundles.sh save-missing "$RUNNER_TEMP/vm-bundles"
        echo "::endgroup::"

    - name: Verify exact complete handoff fragments
      shell: bash
      run: ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"

    - name: Build installable system closures and export exact handoff
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Build and export exact system closures"
        bash scripts/system-handoff.sh save "$RUNNER_TEMP/vm-bundles"
        echo "::endgroup::"
        echo "::group::Verify exact system handoff"
        bash scripts/system-handoff.sh verify "$RUNNER_TEMP/vm-bundles"
        echo "::endgroup::"

    # Persist only misses. The complete handoff below, not these caches, is the
    # authoritative input for every later runner in this workflow run.
    - name: "Save bundle cache: core"
      if: steps.core.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/core.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-core-${{ steps.keys.outputs.key_core }}${{ inputs.cache-suffix }}
    - name: "Save bundle cache: identity"
      if: steps.identity.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/identity.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-identity-${{ steps.keys.outputs.key_identity }}${{ inputs.cache-suffix }}
    - name: "Save bundle cache: observability"
      if: steps.observability.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/observability.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-observability-${{ steps.keys.outputs.key_observability }}${{ inputs.cache-suffix }}
    - name: "Save bundle cache: storage"
      if: steps.storage.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/storage.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-storage-${{ steps.keys.outputs.key_storage }}${{ inputs.cache-suffix }}
    - name: "Save bundle cache: ai"
      if: steps.ai.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/ai.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-ai-${{ steps.keys.outputs.key_ai }}${{ inputs.cache-suffix }}
    - name: "Save bundle cache: VM drivers"
      if: steps.vm_drivers.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/vm-bundles/vm-drivers.nar.gz
        key: ${{ inputs.cache-schema }}-vm-bundle-vm-drivers-${{ steps.keys.outputs.key_vm_drivers }}${{ inputs.cache-suffix }}

    - name: Publish complete Nix handoff for downstream runners
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vm-bundle-handoff
        if-no-files-found: error
        retention-days: 2
        path: ${{ runner.temp }}/vm-bundles
