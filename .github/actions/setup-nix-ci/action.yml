name: Setup Nix CI

description: Install the pinned Nix runner environment and shared incremental cache.

inputs:
  github-token:
    description: GitHub token used by the Nix installer.
    required: true
  enable-kvm:
    description: Enable KVM access for VM consumers.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        github_access_token: ${{ inputs.github-token }}
        enable_kvm: ${{ inputs.enable-kvm }}
    - name: Enable incremental Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        diagnostic-endpoint: ""
        use-flakehub: false
