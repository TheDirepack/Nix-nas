name: One-shot Ruff formatter

on:
  push:
    branches: [agent/automated-merge-releases]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Nix
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format Python and remove this helper
        run: |
          set -euo pipefail
          nix develop .#test -c ruff format services tests scripts
          git rm .github/workflows/format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: apply Ruff formatter'
          git push origin HEAD:agent/automated-merge-releases
