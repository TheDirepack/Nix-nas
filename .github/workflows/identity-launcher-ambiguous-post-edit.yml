name: Identity launcher ambiguous POST edit

on:
  pull_request:
    paths:
      - .github/workflows/identity-launcher-ambiguous-post-edit.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover ambiguous launcher POSTs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("services/nas_identity_sync.py")
          text = path.read_text()
          text = text.replace(
              '''    provider_committed = False\n    application_committed = False\n    application_restore_needed = False\n    outpost_restore_needed = False\n''',
              '''    provider_committed = False\n    provider_create_attempted = False\n    application_committed = False\n    application_create_attempted = False\n    application_restore_needed = False\n    outpost_restore_needed = False\n''',
              1,
          )
          text = text.replace(
              '''        else:\n            provider = authentik_request(\n                token,\n                "providers/proxy/",\n                method="POST",\n                body=provider_payload,\n            )\n''',
              '''        else:\n            provider_create_attempted = True\n            provider = authentik_request(\n                token,\n                "providers/proxy/",\n                method="POST",\n                body=provider_payload,\n            )\n''',
              1,
          )
          text = text.replace(
              '''        else:\n            authentik_request(\n                token,\n                "core/applications/",\n                method="POST",\n                body=application_payload,\n            )\n            application_committed = True\n''',
              '''        else:\n            application_create_attempted = True\n            authentik_request(\n                token,\n                "core/applications/",\n                method="POST",\n                body=application_payload,\n            )\n            application_committed = True\n''',
              1,
          )
          needle = '''        def rollback(label: str, operation: Any) -> None:\n            try:\n                operation()\n            except Exception as rollback_exc:  # noqa: BLE001\n                rollback_errors.append(f"{label}: {type(rollback_exc).__name__}")\n\n        if outpost_restore_needed:\n'''
          replacement = '''        def rollback(label: str, operation: Any) -> None:\n            try:\n                operation()\n            except Exception as rollback_exc:  # noqa: BLE001\n                rollback_errors.append(f"{label}: {type(rollback_exc).__name__}")\n\n        # A non-idempotent POST can succeed upstream even when the client never\n        # receives its response. The staged snapshot proves these reserved\n        # objects did not exist before this transaction, so rediscover exact\n        # names/slugs before rollback and remove any ambiguous creation.\n        if not application_existing and application_create_attempted and not application_committed:\n            try:\n                created_application = next(\n                    (\n                        item\n                        for item in authentik_list(token, "core/applications/")\n                        if item.get("slug") == application_slug\n                    ),\n                    None,\n                )\n                application_committed = isinstance(created_application, Mapping)\n            except Exception as discovery_exc:  # noqa: BLE001\n                rollback_errors.append(f"application discovery: {type(discovery_exc).__name__}")\n\n        if not provider_existing and provider_create_attempted and not provider_committed:\n            try:\n                created_provider = next(\n                    (\n                        item\n                        for item in authentik_list(token, "providers/proxy/")\n                        if item.get("name") == provider_name\n                    ),\n                    None,\n                )\n                if isinstance(created_provider, Mapping):\n                    discovered_pk = created_provider.get("pk")\n                    if discovered_pk is None:\n                        rollback_errors.append("provider discovery: missing primary key")\n                    else:\n                        provider_pk = discovered_pk\n                        provider_committed = True\n            except Exception as discovery_exc:  # noqa: BLE001\n                rollback_errors.append(f"provider discovery: {type(discovery_exc).__name__}")\n\n        if outpost_restore_needed:\n'''
          if needle not in text:
              raise SystemExit("rollback insertion point not found")
          text = text.replace(needle, replacement, 1)
          path.write_text(text)

          test_path = Path("tests/test_setup_launcher_transaction.py")
          tests = test_path.read_text()
          marker = '\n\nif __name__ == "__main__":\n'
          addition = '''

              def test_lost_provider_post_response_removes_discovered_provider(self) -> None:
                  failure = sync.SyncError("lost provider POST response")
                  with (
                      mock.patch.object(sync, "PUBLIC_HOST", "nas.local"),
                      mock.patch.object(sync, "default_flows", return_value=flows()),
                      mock.patch.object(
                          sync,
                          "authentik_list",
                          side_effect=[
                              [],
                              [],
                              [embedded_outpost()],
                              [{"name": "NAS Setup", "pk": 11}],
                          ],
                      ),
                      mock.patch.object(
                          sync,
                          "authentik_request",
                          side_effect=[failure, None],
                      ) as request,
                  ):
                      with self.assertRaisesRegex(sync.SyncError, "lost provider POST response"):
                          sync.ensure_setup_launcher("token")

                  self.assertEqual(request.call_args_list[-1].args, ("token", "providers/proxy/11/"))
                  self.assertEqual(request.call_args_list[-1].kwargs, {"method": "DELETE"})

              def test_lost_application_post_response_removes_discovered_application_and_provider(self) -> None:
                  failure = sync.SyncError("lost application POST response")
                  with (
                      mock.patch.object(sync, "PUBLIC_HOST", "nas.local"),
                      mock.patch.object(sync, "default_flows", return_value=flows()),
                      mock.patch.object(
                          sync,
                          "authentik_list",
                          side_effect=[
                              [],
                              [],
                              [embedded_outpost()],
                              [{"slug": "nas-setup", "provider": 11}],
                          ],
                      ),
                      mock.patch.object(
                          sync,
                          "authentik_request",
                          side_effect=[{"pk": 11}, failure, None, None],
                      ) as request,
                  ):
                      with self.assertRaisesRegex(sync.SyncError, "lost application POST response"):
                          sync.ensure_setup_launcher("token")

                  rollback_application, rollback_provider = request.call_args_list[-2:]
                  self.assertEqual(rollback_application.args, ("token", "core/applications/nas-setup/"))
                  self.assertEqual(rollback_application.kwargs, {"method": "DELETE"})
                  self.assertEqual(rollback_provider.args, ("token", "providers/proxy/11/"))
                  self.assertEqual(rollback_provider.kwargs, {"method": "DELETE"})
          '''
          if "test_lost_provider_post_response_removes_discovered_provider" not in tests:
              tests = tests.replace(marker, addition + marker)
              test_path.write_text(tests)
          PY
      - name: Format and test ambiguous POST rollback
        run: |
          nix develop .#test -c ruff format services/nas_identity_sync.py tests/test_setup_launcher_transaction.py
          nix develop .#test -c ruff check services/nas_identity_sync.py tests/test_setup_launcher_transaction.py tests/test_identity_sync.py
          nix develop .#test -c python3 -m unittest tests.test_setup_launcher_transaction tests.test_identity_sync
      - name: Commit tested hardening
        run: |
          set -euo pipefail
          git config user.name "TheDirepack"
          git config user.email "48868531+TheDirepack@users.noreply.github.com"
          git add services/nas_identity_sync.py tests/test_setup_launcher_transaction.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(identity): recover ambiguous launcher POSTs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
