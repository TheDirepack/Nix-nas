name: Stage coding-agent fixture repair

on:
  push:
    branches:
      - fix/ci-runtime-and-code-fixes-20260808

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/ci-runtime-and-code-fixes-20260808
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair stdlib grp fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_coding_agent.py')
          text = path.read_text()
          count = text.count('self.gr_members = members')
          if count != 2:
              raise SystemExit(f'expected exactly two stale grp fixtures, found {count}')
          path.write_text(text.replace('self.gr_members = members', 'self.gr_mem = members'))
          PY
      - name: Validate focused regression and static gates
        run: |
          nix develop .#test -c python -m unittest -v tests.test_coding_agent
          nix shell nixpkgs#ruff -c ruff format tests/test_coding_agent.py
          nix shell nixpkgs#ruff -c ruff check tests/test_coding_agent.py services/nas_coding_agent.py
          nix shell nixpkgs#pyright -c pyright --project pyproject.toml
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_coding_agent.py
          git commit -m "test: model grp fixtures with real gr_mem field"
          git push origin HEAD:fix/ci-runtime-and-code-fixes-20260808
