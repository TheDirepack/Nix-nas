name: One-shot Compose owner target migration

on:
  push:
    branches:
      - agent/managed-services-v2-simplify-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/managed-services-v2-simplify-v2
      - name: Use a target as the compiled Compose owner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("services/nas_v2_spec.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if runtime["type"] == "systemd":
              owner_unit = runtime["unit"]
          else:
              owner_unit = f"nas-v2-{service_id}.service"
          '''
          new = '''        if runtime["type"] == "systemd":
              owner_unit = runtime["unit"]
          elif runtime["type"] == "compose":
              owner_unit = f"nas-v2-{service_id}.target"
          else:
              owner_unit = f"nas-v2-{service_id}.service"
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one owner-unit compiler block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/one-shot-compose-owner-target.yml").unlink()
          PY
      - name: Commit compiler migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/nas_v2_spec.py .github/workflows/one-shot-compose-owner-target.yml
          git commit -m 'refactor(v2): compile Compose owners as targets'
          git push origin HEAD:agent/managed-services-v2-simplify-v2
