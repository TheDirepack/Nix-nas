name: Agent pre-VM repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/managed-services-v2-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/managed-services-v2-core
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply typed post-rebase fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "services/nas_cockpit_api.py",
              '            ttl_seconds=3600,\n            metadata={"jobId": job_id},\n',
              '            ttl_seconds=3600,\n',
          )
          replace(
              "services/nas_state.py",
              '            comparison = "match"\n            if status == "absent":\n',
              '            comparison = "match"\n            current: str | None = None\n            if status == "absent":\n',
          )
          replace(
              "tests/test_contract_tooling.py",
              '            def log_message(self, *_args):\n                pass\n',
              '            def log_message(self, format, *args):\n                del format, args\n',
          )
          replace(
              "tests/test_contract_tooling.py",
              '        self.assertIn("run_dynamic_web_scan", host)\n',
              '        self.assertNotIn("run_dynamic_web_scan", host)\n',
          )
          PY
      - name: Apply canonical Ruff formatting
        run: nix shell nixpkgs#ruff -c ruff format services tests scripts
      - name: Verify Python lint formatting and types
        run: |
          nix shell nixpkgs#ruff -c ruff check services tests scripts
          nix shell nixpkgs#ruff -c ruff format --check services tests scripts
          nix shell nixpkgs#pyright -c pyright --project pyproject.toml
      - name: Verify affected regressions
        run: |
          nix develop .#test -c env PYTHONPATH=tests python3 -m unittest \
            tests.test_cockpit_api \
            tests.test_state \
            tests.test_contract_tooling -v
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services tests
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "fix(ci): repair typed V2 regressions after main rebase"
          git push origin HEAD:agent/managed-services-v2-core
