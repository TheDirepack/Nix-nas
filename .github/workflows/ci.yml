name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      test-tier:
        description: Test scope for on-demand runs; full includes installer and deterministic installed-VM checks; fuzzing is local-only
        type: choice
        required: false
        default: fast
        options: [fast, full, installer]
      force-cache-miss:
        description: Run the full cache-miss bundle handoff and persistence path in an isolated cache namespace
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CACHE_SCHEMA: ci-v6-staged-node24-ubuntu2404

jobs:
  # Stage 1: one prepared environment runs every inexpensive qualification
  # section. Subchecks keep running after failures; the final reporter fails
  # once with exact commands, exit codes, timings, log tails, and full logs.
  prebuild:
    name: Pre-build qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Initialize pre-build diagnostics
        run: |
          rm -rf ci-logs
          mkdir -p ci-logs
          : > ci-logs/results.tsv

      - name: "Section: repository and test contracts"
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .github/ci-checks.sh
          failed=0

          ci_run contracts preflight "Source-only repository preflight" env \
            NAS_PREFLIGHT_SKIP_TESTS=1 \
            NAS_PREFLIGHT_SKIP_COCKPIT_BUNDLE=1 \
            NAS_PREFLIGHT_SKIP_TOOLING=1 \
            NAS_PREFLIGHT_SKIP_NIX=1 \
            ./scripts/preflight.sh || failed=1
          ci_run contracts python-syntax "Python syntax inventory" \
            ./scripts/validate-python-syntax.py || failed=1
          ci_run contracts test-inventory "Test inventory contract" \
            nix develop .#test -c python3 scripts/validate-test-inventory.py || failed=1

          check_shell_syntax() {
            local rc=0 script
            while IFS= read -r -d '' script; do
              bash -n "$script" || rc=1
            done < <(find scripts tests/vm -type f -name '*.sh' -print0)
            return "$rc"
          }
          ci_run contracts shell-syntax "Shell syntax" check_shell_syntax || failed=1
          exit "$failed"

      - name: "Section: static analysis and configuration"
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .github/ci-checks.sh
          failed=0

          ci_run static secret-faults "Secret transaction fault injection" \
            nix shell nixpkgs#bats -c bats tests/bats || failed=1
          ci_run static shellcheck "ShellCheck" \
            nix develop .#test -c shellcheck scripts/*.sh scripts/lib/*.sh tests/vm/*.sh || failed=1
          ci_run static actionlint "GitHub Actions lint" \
            nix develop .#test -c actionlint \
            .github/workflows/ci.yml .github/workflows/release.yml || failed=1
          ci_run static ruff-check "Python lint" \
            nix develop .#test -c ruff check services tests scripts || failed=1
          ci_run static ruff-format "Python formatting" \
            nix develop .#test -c ruff format --check services tests scripts || failed=1
          ci_run static pyright "Python types" \
            nix develop .#test -c pyright --project pyproject.toml || failed=1
          ci_run static prettier "JavaScript formatting" \
            nix shell nixpkgs#prettier -c prettier --check \
            "cockpit/src/**/*.{js,jsx,scss}" "cockpit/e2e/*.mjs" \
            "tests/js/*.mjs" prettier.config.mjs || failed=1
          ci_run static nix-matrix "Nix configuration matrix" \
            ./scripts/nix-config-matrix.sh || failed=1
          ci_run static reference-eval "Reference configuration evaluation" \
            ./scripts/evaluate-reference-configurations.sh || failed=1
          exit "$failed"

      - name: "Section: unit, coverage, and maintainer contracts"
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .github/ci-checks.sh
          failed=0

          ci_run unit fast-python "Fast Python unit tests" \
            nix develop .#test -c ./scripts/run-unit-tests.py \
            --coverage coverage.json --quiet --jobs 4 \
            --exclude test_maintainer_core.py \
            --exclude test_maintainer_matrix.py \
            --exclude test_maintainer_release.py \
            --exclude test_contract_tooling.py \
            --exclude test_fuzz_boundaries.py \
            --exclude test_property_invariants.py \
            --exclude test_secret_security_fuzz.py || failed=1

          check_coverage_floor() {
            if [[ ! -s coverage.json ]]; then
              echo "coverage.json was not produced by the fast unit suite"
              return 2
            fi
            nix develop .#test -c python3 scripts/check-coverage.py \
              coverage.json --total-floor 66
          }
          ci_run unit coverage-floor "Coverage floor" check_coverage_floor || failed=1

          for contract in \
            test_maintainer_core.py \
            test_maintainer_matrix.py \
            test_maintainer_release.py \
            test_contract_tooling.py
          do
            slug=${contract%.py}
            ci_run unit "$slug" "Maintainer contract: $contract" \
              nix develop .#test -c ./scripts/run-unit-tests.py \
              --jobs 1 --pattern "$contract" || failed=1
          done
          exit "$failed"

      - name: "Section: security and generated service configuration"
        id: security
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .github/ci-checks.sh
          failed=0

          ci_run security regressions "Deterministic security regression suite" \
            nix develop .#test -c ./scripts/run-security-tests.py || failed=1
          ci_run security semgrep "Semgrep local rules" \
            nix develop .#test -c semgrep --config .semgrep.yml --error \
            services scripts cockpit/src web || failed=1
          ci_run security bandit "Bandit privileged runtime scan" \
            nix develop .#test -c bandit -q -c .bandit -r services scripts -ll -ii || failed=1
          ci_run security caddy "Caddy generator validation" \
            nix develop .#test -c python3 -m unittest \
            tests.test_v2_caddy tests.test_v2_caddy_validate -v || failed=1
          exit "$failed"

      # Keep the unprivileged copy clean: run it before restoring node_modules.
      - name: "Section: unprivileged hermeticity"
        id: nonroot
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .github/ci-checks.sh
          failed=0

          run_nonroot_suite() {
            local nix_bin
            nix_bin=$(command -v nix)
            sudo useradd --create-home --shell /bin/bash nas-ci
            sudo install -d -o nas-ci -g nas-ci /home/nas-ci/worktree
            sudo cp -a "$GITHUB_WORKSPACE/." /home/nas-ci/worktree/
            sudo chown -R nas-ci:nas-ci /home/nas-ci/worktree
            sudo -u nas-ci env HOME=/home/nas-ci TMPDIR=/tmp \
              bash -c "cd /home/nas-ci/worktree && exec \"$nix_bin\" develop .#test -c ./scripts/run-unit-tests.py --jobs 4 --exclude test_maintainer_core.py --exclude test_maintainer_matrix.py --exclude test_maintainer_release.py --exclude test_contract_tooling.py --exclude test_fuzz_boundaries.py --exclude test_property_invariants.py --exclude test_secret_security_fuzz.py"
          }
          ci_run nonroot fast-suite "Run the fast suite without root-owned state" \
            run_nonroot_suite || failed=1
          exit "$failed"

      # Node dependencies are deliberately restored only after source and
      # hermeticity checks, so generated node_modules never pollutes preflight.
      - name: Restore exact Node 24 dependencies
        id: prebuild-node-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install Node dependencies on cache miss
        if: steps.prebuild-node-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund

      - name: "Section: Cockpit source and dependency audit"
        id: cockpit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .github/ci-checks.sh
          failed=0

          check_cockpit_js_syntax() {
            local rc=0 script
            for script in cockpit/src/*.js; do
              node --check "$script" || rc=1
            done
            return "$rc"
          }
          ci_run cockpit js-syntax "Cockpit JavaScript syntax" \
            check_cockpit_js_syntax || failed=1
          ci_run cockpit source-contract "Cockpit source renderer contract" \
            node cockpit/build.js --check-source || failed=1
          ci_run cockpit jsx "Cockpit JSX validation" \
            node scripts/validate-cockpit-jsx.cjs || failed=1
          ci_run cockpit unit-tests "Cockpit unit tests" \
            node --test tests/js/*.test.mjs || failed=1
          ci_run cockpit npm-audit "Fresh npm vulnerability audit" \
            npm --prefix cockpit audit --audit-level=high || failed=1
          exit "$failed"

      - name: Retain current coverage for PR baseline comparison
        if: always() && hashFiles('coverage.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          if-no-files-found: error
          retention-days: 14
          path: coverage.json
      - name: Retain complete pre-build diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuild-check-logs
          if-no-files-found: error
          retention-days: 14
          path: ci-logs
      - name: Report all pre-build failures
        if: always()
        env:
          CI_REPORT_TITLE: Pre-build qualification
        run: |
          python3 scripts/ci-check-report.py \
            --results ci-logs/results.tsv \
            --tail-lines 30 \
            "contracts=${{ steps.contracts.outcome }}" \
            "static=${{ steps.static.outcome }}" \
            "unit-and-coverage=${{ steps.unit.outcome }}" \
            "security=${{ steps.security.outcome }}" \
            "cockpit=${{ steps.cockpit.outcome }}" \
            "unprivileged=${{ steps.nonroot.outcome }}"

  # PR coverage comparison is intentionally independent of other pre-build
  # failures so one run can reveal both source failures and coverage drift.
  coverage-diff:
    name: PR coverage drift
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [prebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download current coverage
        id: current-coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
      - name: Resolve main baseline revision
        id: main-baseline
        run: echo "sha=$(git -C main rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore main coverage baseline
        id: main-coverage
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: main-coverage.json
          key: ${{ env.CI_CACHE_SCHEMA }}-coverage-main-${{ runner.os }}-${{ steps.main-baseline.outputs.sha }}-${{ hashFiles('scripts/prepare-coverage-baseline.py') }}
      - name: Install Nix for uncached baseline
        if: steps.main-coverage.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Nix cache for uncached baseline
        if: steps.main-coverage.outputs.cache-hit != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Build main coverage baseline
        id: baseline-build
        continue-on-error: true
        if: steps.main-coverage.outputs.cache-hit != 'true'
        working-directory: main
        run: |
          python3 ../scripts/prepare-coverage-baseline.py .
          nix develop .#test -c ./scripts/run-unit-tests.py \
            --coverage ../main-coverage.json --quiet --jobs 4 \
            --exclude test_maintainer_core.py \
            --exclude test_maintainer_matrix.py \
            --exclude test_maintainer_release.py \
            --exclude test_contract_tooling.py \
            --exclude test_fuzz_boundaries.py \
            --exclude test_property_invariants.py \
            --exclude test_secret_security_fuzz.py
      - name: Compare current coverage with main
        id: drift
        continue-on-error: true
        if: always()
        run: |
          test -s coverage.json
          test -s main-coverage.json
          python3 scripts/check-coverage.py \
            coverage.json --baseline main-coverage.json --total-floor 66
      - name: Report coverage baseline failures
        if: always()
        env:
          CI_REPORT_TITLE: PR coverage comparison
        run: |
          python3 scripts/ci-check-report.py \
            "current-coverage=${{ steps.current-coverage.outcome }}" \
            "baseline-build=${{ steps.baseline-build.outcome }}" \
            "coverage-drift=${{ steps.drift.outcome }}"

  # Stage 2: expensive products are materialized once. The per-run Nix artifact
  # is authoritative; granular caches exist only to accelerate this producer.
  prepare:
    name: Prepare reusable build handoff
    if: >-
      always() &&
      needs.prebuild.result == 'success' &&
      (needs.coverage-diff.result == 'success' || needs.coverage-diff.result == 'skipped')
    needs: [prebuild, coverage-diff]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Restore exact Node 24 dependencies
        id: prepare-node-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install Cockpit dependencies on cache miss
        if: steps.prepare-node-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Build and verify production Cockpit once
        run: |
          npm --prefix cockpit run build
          node cockpit/build.js --check
          node scripts/validate-cockpit-jsx.cjs
          node --test tests/js/*.test.mjs
      - name: Publish reviewed Cockpit bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cockpit-bundle
          if-no-files-found: error
          retention-days: 14
          path: |
            cockpit/package-lock.json
            cockpit/dist
      - run: git add -f cockpit/package-lock.json cockpit/dist

      - name: Install Nix for reusable system handoff
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast'
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Select VM bundle cache namespace
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast'
        id: vm-bundle-namespace
        env:
          FORCE_CACHE_MISS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force-cache-miss == 'true' }}
        run: |
          if [[ "$FORCE_CACHE_MISS" == true ]]; then
            printf 'suffix=-forced-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            printf 'suffix=\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore/build once and publish complete Nix handoff
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast'
        uses: ./.github/actions/prepare-vm-handoff
        with:
          cache-schema: ${{ env.CI_CACHE_SCHEMA }}
          cache-suffix: ${{ steps.vm-bundle-namespace.outputs.suffix }}

      - name: Restore verified source archive
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast'
        id: source-archive-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: nas-source-release
          key: ${{ env.CI_CACHE_SCHEMA }}-source-archive-${{ github.sha }}${{ steps.vm-bundle-namespace.outputs.suffix }}
      - name: Package and verify as an untrusted consumer
        if: >-
          (github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast') &&
          steps.source-archive-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dependencies="$RUNNER_TEMP/cockpit-node_modules"
          restore_dependencies() {
            if [[ -d "$dependencies" ]]; then
              mv "$dependencies" cockpit/node_modules
            fi
          }
          trap restore_dependencies EXIT
          if [[ -d cockpit/node_modules ]]; then
            rm -rf "$dependencies"
            mv cockpit/node_modules "$dependencies"
          fi

          out="$GITHUB_WORKSPACE/nas-source-release"
          mkdir -p "$out"
          NAS_PREFLIGHT_SKIP_TESTS=1 ./scripts/package-release.sh --source-only "$out"
          archive=$(find "$out" -mindepth 2 -maxdepth 2 -type f -name '*.zip' -print -quit)
          test -n "$archive"
          extract="$RUNNER_TEMP/extracted-source"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          root=$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          (cd "$root" && sha256sum -c MANIFEST.sha256)
          (
            cd "$root"
            NAS_PREFLIGHT_VERIFY_MANIFEST=1 \
              NAS_PREFLIGHT_SKIP_TESTS=1 \
              NAS_PREFLIGHT_SKIP_TOOLING=1 \
              NAS_PREFLIGHT_SKIP_NIX=1 \
              ./scripts/preflight.sh
          )
          restore_dependencies
          trap - EXIT
      - name: Verify restored source archive
        if: >-
          (github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast') &&
          steps.source-archive-cache.outputs.cache-hit == 'true'
        run: |
          archive=$(find nas-source-release -mindepth 2 -maxdepth 2 -type f -name '*.zip' -print -quit)
          test -n "$archive"
          unzip -tq "$archive"
      - name: Save verified source archive
        if: >-
          (github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast') &&
          steps.source-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: nas-source-release
          key: ${{ env.CI_CACHE_SCHEMA }}-source-archive-${{ github.sha }}${{ steps.vm-bundle-namespace.outputs.suffix }}
      - name: Retain source archive evidence
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive-evidence
          if-no-files-found: error
          retention-days: 14
          path: nas-source-release

  # Stage 3a: the Playwright suite already owns internal parallelism, so run it
  # once rather than repeating setup for one grep per runner.
  browser:
    name: Deterministic Cockpit browser qualification
    if: always() && needs.prepare.result == 'success'
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - name: Restore exact dependencies
        id: browser-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install dependencies on cache miss
        if: steps.browser-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Restore Playwright engines
        id: playwright-browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ env.CI_CACHE_SCHEMA }}-playwright-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install Playwright engines on cache miss
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npm --prefix cockpit exec -- playwright install chromium firefox webkit
      - name: Install Playwright system dependencies
        run: npm --prefix cockpit exec -- playwright install-deps chromium firefox webkit
      - name: Verify reviewed Cockpit handoff
        run: |
          node cockpit/build.js --check
          node scripts/validate-cockpit-jsx.cjs
      - name: Run complete deterministic browser suite
        env:
          NAS_BROWSER_SUITE: deterministic
        run: npm --prefix cockpit run test:browser
      - name: Retain browser failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            cockpit/playwright-report
            cockpit/test-results

  # Stage 3b: only the two expensive VM variants remain as useful job-level
  # parallelism. Both import the exact same prepared Nix artifact.
  integration:
    name: Full-stack QEMU integration (${{ matrix.vm }})
    if: >-
      always() && needs.prepare.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.test-tier != 'fast'))
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - vm: unencrypted
            check: nas-vm
          - vm: encrypted
            check: nas-vm-encrypted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bundle-handoff
          path: ${{ runner.temp }}/vm-bundles
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Verify and import prepared Nix handoff
        run: |
          ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"
          ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
      - name: Run ${{ matrix.vm }} NixOS VM integration
        run: nix build ".#checks.x86_64-linux.${{ matrix.check }}" --show-trace -L

  # Stage 4: official-media installation reuses the prepared Cockpit and Nix
  # products instead of resolving them again.
  installer:
    name: Official-ISO install, reboot, and final-VM checks
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.browser.result == 'success' && needs.integration.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.test-tier == 'full' || github.event.inputs.test-tier == 'installer')) ||
       (github.event_name != 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    needs: [prepare, browser, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bundle-handoff
          path: ${{ runner.temp }}/vm-bundles
      - name: Compute weekly installer epoch
        id: installer-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore immutable installer media
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/nixos-nas-qemu/*.iso
            ~/.cache/nixos-nas-qemu/*.sha256.remote
            ~/.cache/nixos-nas-qemu/iso-boot
          key: ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-${{ steps.installer-epoch.outputs.week }}-${{ hashFiles('scripts/qemu-test.sh') }}
          restore-keys: |
            ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Enable incremental Nix build and VM cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Verify and import prepared Nix handoff
        run: |
          ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"
          ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
      - name: Restore final-browser dependencies
        id: installer-browser-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install final-browser dependencies on cache miss
        if: steps.installer-browser-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Restore final-VM Playwright engines
        id: installer-playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ env.CI_CACHE_SCHEMA }}-playwright-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install final-VM Playwright engines on cache miss
        if: steps.installer-playwright.outputs.cache-hit != 'true'
        run: npm --prefix cockpit exec -- playwright install chromium firefox webkit
      - name: Install final-VM Playwright system dependencies
        run: npm --prefix cockpit exec -- playwright install-deps chromium firefox webkit
      - name: Install from official NixOS media and reboot-test
        run: nix develop .#qemu-test -c ./scripts/qemu-test.sh installer
      - name: Final VM browser, layout, accessibility, and security checks
        run: nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#nodejs nixpkgs#python3 -c bash ./scripts/qemu-final-browser.sh
      - name: Retain final-VM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-vm-browser-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: |
            cockpit/playwright-report
            cockpit/test-results
            ~/.cache/nixos-nas-qemu/state/browser-console.log

  # Stage 5a: run-fuzz.py owns safe internal parallelism; avoid seven fresh
  # runners that each repeat checkout and environment setup.
  source-fuzz:
    name: Final source fuzz and property qualification
    if: >-
      always() && needs.integration.result == 'success' &&
      needs.browser.result == 'success' &&
      (needs.installer.result == 'success' || needs.installer.result == 'skipped') &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    needs: [integration, browser, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Run all smart-fuzz suites with internal workers
        run: |
          mkdir -p .fuzz-evidence
          set -o pipefail
          nix develop .#test -c ./scripts/run-fuzz.py --jobs 6 \
            2>&1 | tee .fuzz-evidence/source-fuzz.log
      - name: Retain source fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-fuzz-evidence
          if-no-files-found: error
          retention-days: 30
          path: .fuzz-evidence/source-fuzz.log

  # Stage 5b: provision once, then run both adversarial workloads. Each workload
  # continues independently so the final reporter can surface both failures.
  installed-security:
    name: Installed appliance adversarial qualification
    if: >-
      always() && needs.installer.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    needs: [installer, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bundle-handoff
          path: ${{ runner.temp }}/vm-bundles
      - name: Compute weekly installer epoch
        id: security-installer-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore immutable installer media
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/nixos-nas-qemu/*.iso
            ~/.cache/nixos-nas-qemu/*.sha256.remote
            ~/.cache/nixos-nas-qemu/iso-boot
          key: ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-${{ steps.security-installer-epoch.outputs.week }}-${{ hashFiles('scripts/qemu-test.sh') }}
          restore-keys: |
            ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Enable incremental Nix build and VM cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Verify and import prepared Nix handoff
        run: |
          ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"
          ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
      - name: Provision installed appliance once
        run: nix develop .#qemu-test -c ./scripts/qemu-test.sh installer
      - name: Installed-command and HTTP adversarial checks
        id: installed-command
        continue-on-error: true
        env:
          NAS_FINAL_VM_WORKLOAD: installed-command-fuzz
          NAS_INSTALLED_FUZZ_OUT: installed-command-fuzz.json
          NAS_HTTP_ADVERSARIAL_OUT: http-adversarial.json
        run: nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#python3 -c bash ./scripts/qemu-final-browser.sh
      - name: State-aware active ZAP qualification
        id: zap
        continue-on-error: true
        env:
          NAS_FINAL_VM_WORKLOAD: zap-fuzz
          NAS_ZAP_IMAGE: ${{ vars.NAS_ZAP_IMAGE }}
          NAS_ZAP_CONFIRM_ACTIVE: "1"
          NAS_ZAP_OUT_DIR: zap-report
          NAS_ZAP_AUTOMATION_MINUTES: "90"
          NAS_ZAP_BROWSER_WORKERS: "2"
        run: |
          test -n "$NAS_ZAP_IMAGE"
          nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#python3 \
            -c bash ./scripts/qemu-final-browser.sh
      - name: Retain installed security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-security-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: |
            installed-command-fuzz.json
            http-adversarial.json
            zap-report
            ~/.cache/nixos-nas-qemu/state/browser-console.log
      - name: Report all installed-security failures
        if: always()
        env:
          CI_REPORT_TITLE: Installed appliance adversarial qualification
        run: |
          python3 scripts/ci-check-report.py \
            "installed-command=${{ steps.installed-command.outcome }}" \
            "zap=${{ steps.zap.outcome }}"

  summary:
    name: Pipeline summary
    if: always()
    needs: [prebuild, coverage-diff, prepare, browser, integration, installer, source-fuzz, installed-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Emit summary and fail on incomplete qualification
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          TEST_TIER: ${{ github.event.inputs.test-tier }}
        run: python3 scripts/ci-summary.py
