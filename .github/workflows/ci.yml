name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test-tier:
        description: Test scope for on-demand runs
        type: choice
        required: false
        default: fast
        options: [fast, full, installer]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cockpit:
    name: Build shared Cockpit dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore reviewed Cockpit build
        id: cockpit-build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cockpit/dist
          key: cockpit-build-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json', 'cockpit/package.json', 'cockpit/build.js', 'cockpit/src/**', 'scripts/validate-cockpit-jsx.cjs', 'tests/js/**') }}
      - name: Restore exact Cockpit dependencies
        id: cockpit-deps
        if: steps.cockpit-build.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cockpit/node_modules
          key: cockpit-node-modules-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install Cockpit dependencies on cache miss
        if: steps.cockpit-build.outputs.cache-hit != 'true' && steps.cockpit-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Refresh dependency vulnerability audit
        run: npm --prefix cockpit audit --audit-level=high
      - name: Build and test Cockpit on build-cache miss
        if: steps.cockpit-build.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          test -f cockpit/package-lock.json
          npm --prefix cockpit run build
          npm --prefix cockpit run check
          node scripts/validate-cockpit-jsx.cjs
          node --test tests/js/*.test.mjs
      - name: Retain the exact lock and output bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cockpit-bundle
          if-no-files-found: error
          retention-days: 14
          path: |
            cockpit/package-lock.json
            cockpit/dist

  test:
    name: Source unit, coverage, and syntax tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore exact fast-suite result and coverage
        id: unit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            coverage.json
            .ci-cache/unit-pass
          key: unit-coverage-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'services/**/*.py', 'scripts/**/*.py', 'tests/**/*.py') }}
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Python unit tests and branch coverage floor
        if: steps.unit-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/validate-python-syntax.py
          nix develop .#test -c ./scripts/run-unit-tests.py --coverage coverage.json --quiet --jobs 4 --exclude test_maintainer_core.py --exclude test_maintainer_matrix.py --exclude test_maintainer_release.py --exclude test_contract_tooling.py
          mkdir -p .ci-cache
          printf 'passed\n' > .ci-cache/unit-pass
      - name: Enforce branch coverage floor
        run: nix develop .#test -c python3 scripts/check-coverage.py coverage.json --total-floor 66
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          if-no-files-found: error
          retention-days: 14
          path: coverage.json
      - name: Test inventory contract
        run: nix develop .#test -c python3 scripts/validate-test-inventory.py
      - name: Maintainer core integration tests
        run: nix develop .#test -c ./scripts/run-unit-tests.py --jobs 1 --pattern 'test_maintainer_core.py'
      - name: Maintainer matrix integration tests
        run: nix develop .#test -c ./scripts/run-unit-tests.py --jobs 1 --pattern 'test_maintainer_matrix.py'
      - name: Maintainer release integration tests
        run: nix develop .#test -c ./scripts/run-unit-tests.py --jobs 1 --pattern 'test_maintainer_release.py'
      - name: Tooling contract tests
        run: nix develop .#test -c ./scripts/run-unit-tests.py --jobs 1 --pattern 'test_contract_tooling.py'
      - name: Shell syntax
        run: |
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts tests/vm -type f -name '*.sh' -print0)
      - name: JavaScript and JSX source
        run: |
          for script in cockpit/src/*.js; do node --check "$script"; done
          node cockpit/build.js --check-source
          node scripts/validate-cockpit-jsx.cjs
          node --test tests/js/*.test.mjs
      - name: JSON and renderer checks
        run: NAS_PREFLIGHT_SKIP_TESTS=1 ./scripts/preflight.sh

  test-nonroot:
    name: Unprivileged unit-test hermeticity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute weekly cache epoch
        id: nonroot-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore unprivileged-suite pass
        id: nonroot-result
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/nonroot-pass
          key: nonroot-pass-${{ runner.os }}-${{ steps.nonroot-epoch.outputs.week }}-${{ hashFiles('flake.lock', 'flake.nix', 'services/**/*.py', 'scripts/**/*.py', 'tests/**/*.py') }}
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        if: steps.nonroot-result.outputs.cache-hit != 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        if: steps.nonroot-result.outputs.cache-hit != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Run the fast suite without root-owned state
        if: steps.nonroot-result.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          nix_bin="$(command -v nix)"
          sudo useradd --create-home --shell /bin/bash nas-ci
          sudo install -d -o nas-ci -g nas-ci /home/nas-ci/worktree
          sudo cp -a "$GITHUB_WORKSPACE/." /home/nas-ci/worktree/
          sudo chown -R nas-ci:nas-ci /home/nas-ci/worktree
          sudo -u nas-ci env HOME=/home/nas-ci TMPDIR=/tmp \
            bash -c 'cd /home/nas-ci/worktree && exec "$1" develop .#test -c ./scripts/run-unit-tests.py --jobs 4 --exclude test_maintainer_core.py --exclude test_maintainer_matrix.py --exclude test_maintainer_release.py --exclude test_contract_tooling.py' bash "$nix_bin"
          mkdir -p .ci-cache
          printf 'passed\n' > .ci-cache/nonroot-pass

  coverage-diff:
    name: Per-file coverage drift vs main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report
          path: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
      - name: Resolve main baseline revision
        id: main-baseline
        run: echo "sha=$(git -C main rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore main coverage baseline
        id: main-coverage
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: main-coverage.json
          key: coverage-main-${{ runner.os }}-${{ steps.main-baseline.outputs.sha }}
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Coverage on the main-branch baseline
        if: steps.main-coverage.outputs.cache-hit != 'true'
        working-directory: main
        run: nix develop .#test -c ./scripts/run-unit-tests.py --coverage ../main-coverage.json --quiet --jobs 4 --exclude test_maintainer_core.py --exclude test_maintainer_matrix.py --exclude test_maintainer_release.py --exclude test_contract_tooling.py
      - name: Enforce per-file coverage drift vs main
        run: nix develop .#test -c python3 scripts/check-coverage.py coverage.json --baseline main-coverage.json --total-floor 66

  caddy-validate:
    name: Caddy fragment validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Validate generated Caddy fragment with caddy binary
        run: |
          set -euo pipefail
          nix shell nixpkgs#caddy -c caddy version
          nix develop .#test -c python3 -m unittest tests.test_service_caddy_validate -v
          nix develop .#test -c python3 - <<'PY'
          import sys
          sys.path.insert(0, "services")
          import nas_service_caddy as caddy
          effective = {
              "schemaVersion": 2,
              "generation": 1,
              "endpoints": {
                  "photos:web": {
                      "transport": "http",
                      "targetPort": 2283,
                      "exposure": {"type": "hostname", "value": "photos.local"},
                      "auth": {"mode": "public"},
                  },
                  "app:api": {
                      "transport": "http",
                      "targetPort": 8080,
                      "exposure": {"type": "path", "value": "/managed-api"},
                      "auth": {"mode": "public"},
                  },
              },
          }
          fragment = caddy.generate_caddy_fragment(effective)
          assert len(fragment["routes"]) == 2
          print("caddy fragment routes=2")
          PY
          caddyfile=$(mktemp)
          nix develop .#test -c python3 - <<'PY' > "$caddyfile"
          import sys
          sys.path.insert(0, "services")
          import nas_service_caddy as c
          print(c.generate_caddyfile({
              "schemaVersion": 2,
              "endpoints": {
                  "photos:web": {
                      "transport": "http",
                      "targetPort": 2283,
                      "exposure": {"type": "hostname", "value": "photos.local"},
                      "auth": {"mode": "public"},
                  }
              },
          }))
          PY
          nix shell nixpkgs#caddy -c caddy fmt --diff "$caddyfile" >/dev/null || true
          nix shell nixpkgs#caddy -c caddy adapt --adapter caddyfile --config "$caddyfile" >/dev/null

  fuzz:
    name: Fuzz and property invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deterministic parser and boundary fuzzing
        run: |
          ./scripts/fuzz.py --cases 5000 --seed 0x4e41533232
          ./scripts/fuzz-executables.py --cases 5 --seed 0x534352495054
          python3 -m unittest tests.test_fuzz_boundaries -v
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Hypothesis property tests
        run: nix develop .#test -c python -m unittest tests.test_property_invariants -v

  security:
    name: Static security and injection checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Project security regression suite
        run: nix develop .#test -c ./scripts/run-security-tests.py
      - name: Semgrep local rules
        run: nix develop .#test -c semgrep --config .semgrep.yml --error services scripts cockpit/src web
      - name: Bandit privileged runtime Python scan
        run: nix develop .#test -c bandit -q -c .bandit -r services -ll -ii

  browser:
    name: Final browser rendering, layout, XSS, and accessibility gate
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier == 'full' || github.event.inputs.test-tier == 'installer') &&
      needs.integration.result == 'success' &&
      (needs.installer.result == 'success' || needs.installer.result == 'skipped')
    needs: [integration, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cockpit-bundle
          path: cockpit
      - name: Compute weekly browser cache epoch
        id: browser-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore passing browser-suite result
        id: browser-result
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cockpit/.ci-cache/browser-pass
          key: browser-pass-${{ runner.os }}-${{ steps.browser-epoch.outputs.week }}-${{ hashFiles('flake.lock', 'flake.nix', 'modules/**', 'services/**', 'scripts/**', 'tests/nixos/**', 'tests/vm/**', 'cockpit/package-lock.json', 'cockpit/e2e/**', 'cockpit/dist/**', 'web/**') }}
      - name: Restore exact Cockpit dependencies
        id: browser-deps
        if: steps.browser-result.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cockpit/node_modules
          key: cockpit-node-modules-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install Cockpit dependencies on cache miss
        if: steps.browser-result.outputs.cache-hit != 'true' && steps.browser-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Restore pinned Playwright browser engines
        id: playwright-browsers
        if: steps.browser-result.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install pinned Playwright browser engines on cache miss
        if: steps.browser-result.outputs.cache-hit != 'true' && steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npm --prefix cockpit exec -- playwright install chromium firefox webkit
      - name: Install Playwright system dependencies
        if: steps.browser-result.outputs.cache-hit != 'true'
        run: npm --prefix cockpit exec -- playwright install-deps chromium firefox webkit
      - name: Cross-browser UI security suite after system validation
        if: steps.browser-result.outputs.cache-hit != 'true'
        run: npm --prefix cockpit run test:browser
      - name: Mark browser suite reusable
        if: steps.browser-result.outputs.cache-hit != 'true'
        run: |
          mkdir -p cockpit/.ci-cache
          printf 'passed\n' > cockpit/.ci-cache/browser-pass
      - name: Retain browser failure evidence
        if: always() && steps.browser-result.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            cockpit/playwright-report
            cockpit/test-results

  source-archive:
    name: Packaged-source round trip
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier == 'full' || github.event.inputs.test-tier == 'installer'
    needs: [test, test-nonroot, fuzz, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Package the reviewed source tree
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/nas-source-release"
          mkdir -p "$out"
          NAS_PREFLIGHT_SKIP_TESTS=1 ./scripts/package-release.sh --source-only "$out"
          archive=$(find "$out" -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$archive"
          printf '%s\n' "$archive" > "$GITHUB_WORKSPACE/source-archive-path"
      - name: Extract as an untrusted release consumer and verify it
        run: |
          set -euo pipefail
          archive=$(cat "$GITHUB_WORKSPACE/source-archive-path")
          extract="$GITHUB_WORKSPACE/extracted-source"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          root=$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          cd "$root"
          sha256sum -c MANIFEST.sha256
          NAS_PREFLIGHT_VERIFY_MANIFEST=1 NAS_PREFLIGHT_SKIP_TESTS=1 ./scripts/preflight.sh
          nix flake check --no-build --show-trace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-archive-evidence
          if-no-files-found: error
          retention-days: 14
          path: nas-source-release

  static:
    name: Nix evaluation and lint
    needs: [cockpit, test, test-nonroot, fuzz, security, source-archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - name: Restore static-analysis pass
        id: static-result
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/static-pass
          key: static-pass-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'modules/**', 'services/**', 'scripts/**', 'tests/**', 'cockpit/src/**', 'cockpit/e2e/**', 'web/**', 'pyproject.toml', 'prettier.config.mjs') }}
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        if: steps.static-result.outputs.cache-hit != 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        if: steps.static-result.outputs.cache-hit != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Repository preflight
        if: steps.static-result.outputs.cache-hit != 'true'
        env:
          NAS_PREFLIGHT_REQUIRE_COMPLETE: "1"
        run: ./scripts/preflight.sh
      - name: Secret transaction fault injection
        if: steps.static-result.outputs.cache-hit != 'true'
        run: nix shell nixpkgs#bats -c bats tests/bats
      - name: ShellCheck
        if: steps.static-result.outputs.cache-hit != 'true'
        run: nix shell nixpkgs#shellcheck -c shellcheck scripts/*.sh scripts/lib/*.sh tests/vm/*.sh
      - name: Python correctness lint
        if: steps.static-result.outputs.cache-hit != 'true'
        run: nix shell nixpkgs#ruff -c ruff check services tests scripts
      - name: Python formatting
        if: steps.static-result.outputs.cache-hit != 'true'
        run: nix shell nixpkgs#ruff -c ruff format --check services tests scripts
      - name: Python type checking
        if: steps.static-result.outputs.cache-hit != 'true'
        run: nix shell nixpkgs#pyright -c pyright --project pyproject.toml
      - name: JavaScript formatting
        if: steps.static-result.outputs.cache-hit != 'true'
        run: nix shell nixpkgs#prettier -c prettier --check "cockpit/src/**/*.{js,jsx,scss}" "cockpit/e2e/*.mjs" "web/portal/*.html" "tests/js/*.mjs" prettier.config.mjs
      - name: Evaluate valid and intentionally-invalid configuration matrix
        if: steps.static-result.outputs.cache-hit != 'true'
        run: ./scripts/nix-config-matrix.sh
      - name: Mark static analysis reusable
        if: steps.static-result.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-cache
          printf 'passed\n' > .ci-cache/static-pass

  build:
    name: Build NixOS closures
    needs: [cockpit, static]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - name: Restore successful system-build result
        id: system-build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/system-build-pass
          key: system-build-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'modules/**', 'services/**', 'scripts/**', 'cockpit/dist/**', 'web/**') }}
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        if: steps.system-build.outputs.cache-hit != 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build and VM cache
        if: steps.system-build.outputs.cache-hit != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Build testable systems
        if: steps.system-build.outputs.cache-hit != 'true'
        run: |
          nix build .#nixosConfigurations.nas-ci-ready.config.system.build.toplevel --show-trace
          nix build .#nixosConfigurations.nas-qemu.config.system.build.toplevel --show-trace
      - name: Mark system build reusable
        if: steps.system-build.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-cache
          printf 'passed\n' > .ci-cache/system-build-pass

  integration:
    name: Full-stack QEMU integration
    needs: [cockpit, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - name: Compute weekly VM-test cache epoch
        id: vm-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore passing QEMU integration result
        id: vm-result
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/qemu-integration-pass
          key: qemu-integration-${{ runner.os }}-${{ steps.vm-epoch.outputs.week }}-${{ hashFiles('flake.lock', 'flake.nix', 'modules/**', 'services/**', 'scripts/**', 'tests/nixos/**', 'tests/vm/**', 'cockpit/dist/**', 'web/**') }}
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        if: steps.vm-result.outputs.cache-hit != 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Enable incremental Nix build and VM cache
        if: steps.vm-result.outputs.cache-hit != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Run NixOS VM integration test
        if: steps.vm-result.outputs.cache-hit != 'true'
        run: nix build .#checks.x86_64-linux.nas-vm .#checks.x86_64-linux.nas-vm-encrypted --show-trace -L
      - name: Mark QEMU integration reusable
        if: steps.vm-result.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-cache
          printf 'passed\n' > .ci-cache/qemu-integration-pass

  installer:
    name: Official-ISO install, adversarial scan, and reboot
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.test-tier == 'installer') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [cockpit, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NAS_ZAP_IMAGE: ${{ vars.NAS_ZAP_IMAGE }}
      NAS_ZAP_MODE: full
      NAS_ZAP_CONFIRM_ACTIVE: "1"
      NAS_ZAP_OUT_DIR: zap-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - name: Compute weekly installer cache epoch
        id: installer-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore verified NixOS installer media
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/nixos-nas-qemu
          key: nixos-installer-media-${{ runner.os }}-${{ hashFiles('scripts/qemu-test.sh') }}
          restore-keys: nixos-installer-media-${{ runner.os }}-
      - name: Restore passing installer result
        id: installer-result
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/installer-pass
          key: installer-pass-${{ runner.os }}-${{ steps.installer-epoch.outputs.week }}-${{ hashFiles('flake.lock', 'flake.nix', 'modules/**', 'services/**', 'scripts/**', 'tests/vm/**', 'cockpit/dist/**', 'web/**') }}
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        if: steps.installer-result.outputs.cache-hit != 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Enable incremental Nix build and VM cache
        if: steps.installer-result.outputs.cache-hit != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Install from the official NixOS ISO and reboot-test the appliance
        if: steps.installer-result.outputs.cache-hit != 'true'
        run: nix develop .#qemu-test -c ./scripts/qemu-test.sh installer
      - name: Mark installer test reusable
        if: steps.installer-result.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p .ci-cache
          printf 'passed\n' > .ci-cache/installer-pass
      - name: Retain dynamic web-security reports
        if: always() && env.NAS_ZAP_IMAGE != '' && steps.installer-result.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-security-reports
          if-no-files-found: error
          retention-days: 30
          path: zap-report

  summary:
    name: Pipeline summary
    if: always()
    needs: [cockpit, test, test-nonroot, coverage-diff, caddy-validate, fuzz, security, browser, source-archive, static, build, integration, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Emit compact markdown summary
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS_JSON"])
          lines = ["## CI pipeline summary", "", "| Job | Result |", "| --- | --- |"]
          lines.extend(f"| {name} | {data.get('result', 'skipped').upper()} |" for name, data in sorted(needs.items()))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
