name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      test-tier:
        description: Test scope for on-demand runs; full includes installer and installed-VM checks
        type: choice
        required: false
        default: fast
        options: [fast, full, installer]
      force-cache-miss:
        description: Run the full cache-miss bundle handoff and persistence path in an isolated cache namespace
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CACHE_SCHEMA: ci-v5-node24-ubuntu2404

jobs:
  # Fast deterministic qualification runs in parallel. Downstream jobs depend
  # directly on the qualifications they require; there are no synthetic gate
  # jobs whose only purpose is to repeat GitHub's dependency semantics.
  test:
    name: Fast source unit, coverage, and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Source-only repository preflight
        run: NAS_PREFLIGHT_SKIP_TESTS=1 NAS_PREFLIGHT_SKIP_COCKPIT_BUNDLE=1 NAS_PREFLIGHT_SKIP_TOOLING=1 NAS_PREFLIGHT_SKIP_NIX=1 ./scripts/preflight.sh
      - name: Fast Python unit tests and branch coverage floor
        run: |
          ./scripts/validate-python-syntax.py
          nix develop .#test -c ./scripts/run-unit-tests.py --coverage coverage.json --quiet --jobs 4 \
            --exclude test_maintainer_core.py \
            --exclude test_maintainer_matrix.py \
            --exclude test_maintainer_release.py \
            --exclude test_contract_tooling.py \
            --exclude test_fuzz_boundaries.py \
            --exclude test_property_invariants.py \
            --exclude test_secret_security_fuzz.py
          nix develop .#test -c python3 scripts/check-coverage.py coverage.json --total-floor 66
      - name: Test inventory contract
        run: nix develop .#test -c python3 scripts/validate-test-inventory.py
      - name: Maintainer contract tests
        run: |
          nix develop .#test -c ./scripts/run-unit-tests.py --jobs 1 --pattern 'test_maintainer_core.py'
          nix develop .#test -c ./scripts/run-unit-tests.py --jobs 1 --pattern 'test_maintainer_matrix.py'
          nix develop .#test -c ./scripts/run-unit-tests.py --jobs 1 --pattern 'test_maintainer_release.py'
          nix develop .#test -c ./scripts/run-unit-tests.py --jobs 1 --pattern 'test_contract_tooling.py'
      - name: Restore exact Node 24 source dependencies
        id: source-node-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install source dependencies on cache miss
        if: steps.source-node-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Source syntax and renderer contracts
        run: |
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts tests/vm -type f -name '*.sh' -print0)
          for script in cockpit/src/*.js; do node --check "$script"; done
          node cockpit/build.js --check-source
          node scripts/validate-cockpit-jsx.cjs
          node --test tests/js/*.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: coverage-report
          if-no-files-found: error
          retention-days: 14
          path: coverage.json

  test-nonroot:
    name: Fast unprivileged hermeticity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Run the fast suite without root-owned state
        run: |
          set -euo pipefail
          nix_bin="$(command -v nix)"
          sudo useradd --create-home --shell /bin/bash nas-ci
          sudo install -d -o nas-ci -g nas-ci /home/nas-ci/worktree
          sudo cp -a "$GITHUB_WORKSPACE/." /home/nas-ci/worktree/
          sudo chown -R nas-ci:nas-ci /home/nas-ci/worktree
          sudo -u nas-ci env HOME=/home/nas-ci TMPDIR=/tmp \
            bash -c 'cd /home/nas-ci/worktree && exec "$1" develop .#test -c ./scripts/run-unit-tests.py --jobs 4 --exclude test_maintainer_core.py --exclude test_maintainer_matrix.py --exclude test_maintainer_release.py --exclude test_contract_tooling.py --exclude test_fuzz_boundaries.py --exclude test_property_invariants.py --exclude test_secret_security_fuzz.py' bash "$nix_bin"

  security:
    name: Fast deterministic security and injection checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Project deterministic security regression suite
        run: nix develop .#test -c ./scripts/run-security-tests.py
      - name: Semgrep local rules
        run: nix develop .#test -c semgrep --config .semgrep.yml --error services scripts cockpit/src web
      - name: Bandit privileged runtime Python scan
        run: nix develop .#test -c bandit -q -c .bandit -r services scripts -ll -ii

  caddy-validate:
    name: Fast Caddy generator validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Validate generated Caddy fragment with real Caddy
        run: |
          nix shell nixpkgs#caddy -c caddy version
          nix develop .#test -c python3 -m unittest tests.test_service_caddy tests.test_service_caddy_coverage tests.test_service_caddy_validate -v

  static:
    name: Fast Nix evaluation, lint, type and formatting checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Source-only repository preflight
        run: NAS_PREFLIGHT_SKIP_TESTS=1 NAS_PREFLIGHT_SKIP_COCKPIT_BUNDLE=1 NAS_PREFLIGHT_SKIP_TOOLING=1 NAS_PREFLIGHT_SKIP_NIX=1 ./scripts/preflight.sh
      - name: Secret transaction fault injection
        run: nix shell nixpkgs#bats -c bats tests/bats
      - name: ShellCheck
        run: nix shell nixpkgs#shellcheck -c shellcheck scripts/*.sh scripts/lib/*.sh tests/vm/*.sh
      - name: actionlint
        run: nix develop .#test -c actionlint .github/workflows/ci.yml
      - name: Python lint formatting and types
        run: |
          nix shell nixpkgs#ruff -c ruff check services tests scripts
          nix shell nixpkgs#ruff -c ruff format --check services tests scripts
          nix shell nixpkgs#pyright -c pyright --project pyproject.toml
      - name: JavaScript formatting
        run: nix shell nixpkgs#prettier -c prettier --check "cockpit/src/**/*.{js,jsx,scss}" "cockpit/e2e/*.mjs" "tests/js/*.mjs" prettier.config.mjs
      - name: Evaluate valid and intentionally-invalid configuration matrix
        run: ./scripts/nix-config-matrix.sh
      - name: Evaluate complete reference configurations without builds
        run: ./scripts/evaluate-reference-configurations.sh

  dependency-audit:
    name: Fast fresh dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Restore exact Node 24 Cockpit dependencies
        id: audit-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install dependencies on cache miss
        if: steps.audit-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Query the current npm vulnerability database
        run: npm --prefix cockpit audit --audit-level=high

  coverage-diff:
    name: PR per-file coverage drift vs main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
      - name: Resolve main baseline revision
        id: main-baseline
        run: echo "sha=$(git -C main rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore main coverage baseline
        id: main-coverage
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: main-coverage.json
          key: ${{ env.CI_CACHE_SCHEMA }}-coverage-main-${{ runner.os }}-${{ steps.main-baseline.outputs.sha }}-${{ hashFiles('scripts/prepare-coverage-baseline.py') }}
      - name: Correct known test-only fixtures in the historical baseline
        if: steps.main-coverage.outputs.cache-hit != 'true'
        working-directory: main
        run: python3 ../scripts/prepare-coverage-baseline.py .
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Coverage on the main-branch fast baseline
        if: steps.main-coverage.outputs.cache-hit != 'true'
        working-directory: main
        run: |
          nix develop .#test -c ./scripts/run-unit-tests.py --coverage ../main-coverage.json --quiet --jobs 4 \
            --exclude test_maintainer_core.py \
            --exclude test_maintainer_matrix.py \
            --exclude test_maintainer_release.py \
            --exclude test_contract_tooling.py \
            --exclude test_fuzz_boundaries.py \
            --exclude test_property_invariants.py \
            --exclude test_secret_security_fuzz.py
      - name: Enforce per-file coverage drift vs main
        run: nix develop .#test -c python3 scripts/check-coverage.py coverage.json --baseline main-coverage.json --total-floor 66

  # The first expensive producer waits directly for every fast qualification.
  # coverage-diff is PR-only, so a skipped result is explicitly acceptable.
  build:
    name: Build qualified Cockpit, source archive, and NixOS closures
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast') &&
      needs.test.result == 'success' &&
      needs.test-nonroot.result == 'success' &&
      needs.security.result == 'success' &&
      needs.caddy-validate.result == 'success' &&
      needs.static.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      (needs.coverage-diff.result == 'success' || needs.coverage-diff.result == 'skipped')
    needs: [test, test-nonroot, security, caddy-validate, static, dependency-audit, coverage-diff]
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    outputs:
      key_core: ${{ steps.vm_bundles.outputs.key_core }}
      key_identity: ${{ steps.vm_bundles.outputs.key_identity }}
      key_observability: ${{ steps.vm_bundles.outputs.key_observability }}
      key_storage: ${{ steps.vm_bundles.outputs.key_storage }}
      key_ai: ${{ steps.vm_bundles.outputs.key_ai }}
      key_vm_drivers: ${{ steps.vm_bundles.outputs.key_vm_drivers }}
      cache_core_hit: ${{ steps.vm_bundle_core.outputs.cache-hit }}
      cache_identity_hit: ${{ steps.vm_bundle_identity.outputs.cache-hit }}
      cache_observability_hit: ${{ steps.vm_bundle_observability.outputs.cache-hit }}
      cache_storage_hit: ${{ steps.vm_bundle_storage.outputs.cache-hit }}
      cache_ai_hit: ${{ steps.vm_bundle_ai.outputs.cache-hit }}
      cache_vm_drivers_hit: ${{ steps.vm_bundle_vm_drivers.outputs.cache-hit }}
      bundle_cache_complete: ${{ steps.vm_bundle_handoff.outputs.cache_complete }}
      bundle_cache_namespace: ${{ steps.vm_bundle_namespace.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Restore reviewed Cockpit build
        id: cockpit-build-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/dist
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-build-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json', 'cockpit/package.json', 'cockpit/build.js', 'cockpit/src/**') }}
      - name: Restore exact Node 24 dependencies
        id: cockpit-deps
        if: steps.cockpit-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install Cockpit dependencies on cache miss
        if: steps.cockpit-build-cache.outputs.cache-hit != 'true' && steps.cockpit-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Build production bundle
        if: steps.cockpit-build-cache.outputs.cache-hit != 'true'
        run: |
          npm --prefix cockpit run build
          node scripts/validate-cockpit-jsx.cjs
          node --test tests/js/*.test.mjs
      - name: Verify qualified Cockpit bundle
        run: node cockpit/build.js --check
      - name: Retain exact Cockpit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cockpit-bundle
          if-no-files-found: error
          retention-days: 14
          path: |
            cockpit/package-lock.json
            cockpit/dist
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve Nix store bundle versions
        id: vm_bundles
        run: ./scripts/vm-bundles.sh keys >> "$GITHUB_OUTPUT"
      - name: Select VM bundle cache namespace
        id: vm_bundle_namespace
        env:
          FORCE_CACHE_MISS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force-cache-miss == 'true' }}
        run: |
          if [[ "$FORCE_CACHE_MISS" == true ]]; then
            printf 'suffix=-forced-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Forced cache-miss qualification uses an isolated namespace."
          else
            printf 'suffix=\n' >> "$GITHUB_OUTPUT"
          fi
      - name: "Restore/cache Nix store bundle: core"
        id: vm_bundle_core
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/core.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-core-${{ steps.vm_bundles.outputs.key_core }}${{ steps.vm_bundle_namespace.outputs.suffix }}
      - name: "Restore/cache Nix store bundle: identity"
        id: vm_bundle_identity
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/identity.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-identity-${{ steps.vm_bundles.outputs.key_identity }}${{ steps.vm_bundle_namespace.outputs.suffix }}
      - name: "Restore/cache Nix store bundle: observability"
        id: vm_bundle_observability
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/observability.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-observability-${{ steps.vm_bundles.outputs.key_observability }}${{ steps.vm_bundle_namespace.outputs.suffix }}
      - name: "Restore/cache Nix store bundle: storage"
        id: vm_bundle_storage
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/storage.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-storage-${{ steps.vm_bundles.outputs.key_storage }}${{ steps.vm_bundle_namespace.outputs.suffix }}
      - name: "Restore/cache Nix store bundle: ai"
        id: vm_bundle_ai
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/ai.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-ai-${{ steps.vm_bundles.outputs.key_ai }}${{ steps.vm_bundle_namespace.outputs.suffix }}
      - name: "Restore/cache Nix store bundle: vm-drivers"
        id: vm_bundle_vm_drivers
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/vm-drivers.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-vm-drivers-${{ steps.vm_bundles.outputs.key_vm_drivers }}${{ steps.vm_bundle_namespace.outputs.suffix }}
      - name: Determine whether the exact VM bundle set was restored
        id: vm_bundle_handoff
        run: |
          if [[ \
            "${{ steps.vm_bundle_core.outputs.cache-hit }}" == true && \
            "${{ steps.vm_bundle_identity.outputs.cache-hit }}" == true && \
            "${{ steps.vm_bundle_observability.outputs.cache-hit }}" == true && \
            "${{ steps.vm_bundle_storage.outputs.cache-hit }}" == true && \
            "${{ steps.vm_bundle_ai.outputs.cache-hit }}" == true && \
            "${{ steps.vm_bundle_vm_drivers.outputs.cache-hit }}" == true
          ]]; then
            printf 'cache_complete=true\n' >> "$GITHUB_OUTPUT"
            echo "All exact VM bundle caches were restored; export and publish are unnecessary."
          else
            printf 'cache_complete=false\n' >> "$GITHUB_OUTPUT"
            echo "At least one exact VM bundle cache is missing; only missing bundles will be exported."
          fi
      - name: Reassemble cached Nix store bundles before configuration builds
        run: ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
      - name: Restore verified source archive
        id: source_archive_cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: nas-source-release
          key: ${{ env.CI_CACHE_SCHEMA }}-source-archive-${{ github.sha }}${{ steps.vm_bundle_namespace.outputs.suffix }}
      - name: Package and verify as an untrusted consumer
        if: >-
          steps.vm_bundle_handoff.outputs.cache_complete != 'true' &&
          steps.source_archive_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          node cockpit/build.js --check
          dependencies="$RUNNER_TEMP/cockpit-node_modules"
          restore_dependencies() {
            if [[ -d "$dependencies" ]]; then
              mv "$dependencies" cockpit/node_modules
            fi
          }
          trap restore_dependencies EXIT
          if [[ -d cockpit/node_modules ]]; then
            rm -rf "$dependencies"
            mv cockpit/node_modules "$dependencies"
          fi
          out="$GITHUB_WORKSPACE/nas-source-release"
          mkdir -p "$out"
          NAS_PREFLIGHT_SKIP_TESTS=1 ./scripts/package-release.sh --source-only "$out"
          archive=$(find "$out" -mindepth 2 -maxdepth 2 -type f -name '*.zip' -print -quit)
          test -n "$archive"
          extract="$RUNNER_TEMP/extracted-source"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          root=$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          test -x "$root/scripts/preflight.sh"
          test -x "$root/scripts/package-release.sh"
          test -x "$root/scripts/qemu-test.sh"
          test -x "$root/cockpit/build.js"
          cd "$root"
          sha256sum -c MANIFEST.sha256
          NAS_PREFLIGHT_VERIFY_MANIFEST=1 NAS_PREFLIGHT_SKIP_TESTS=1 NAS_PREFLIGHT_SKIP_TOOLING=1 NAS_PREFLIGHT_SKIP_NIX=1 ./scripts/preflight.sh
          ./scripts/nix-config-matrix.sh
          ./scripts/evaluate-reference-configurations.sh
          restore_dependencies
          trap - EXIT
      - name: Verify restored source archive
        if: >-
          steps.vm_bundle_handoff.outputs.cache_complete != 'true' &&
          steps.source_archive_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          archive=$(find nas-source-release -mindepth 2 -maxdepth 2 -type f -name '*.zip' -print -quit)
          test -n "$archive"
          unzip -tq "$archive"
          extract="$RUNNER_TEMP/extracted-source-cache"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          root=$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          test -x "$root/scripts/preflight.sh"
          test -x "$root/scripts/package-release.sh"
          test -x "$root/scripts/qemu-test.sh"
          test -x "$root/cockpit/build.js"
          (cd "$root" && sha256sum -c MANIFEST.sha256)
          echo "Reused the verified source archive for commit $GITHUB_SHA."
      - name: Save verified source archive
        if: >-
          steps.vm_bundle_handoff.outputs.cache_complete != 'true' &&
          steps.source_archive_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: nas-source-release
          key: ${{ env.CI_CACHE_SCHEMA }}-source-archive-${{ github.sha }}${{ steps.vm_bundle_namespace.outputs.suffix }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          steps.vm_bundle_handoff.outputs.cache_complete != 'true' &&
          steps.source_archive_cache.outputs.cache-hit != 'true'
        with:
          name: source-archive-evidence
          if-no-files-found: error
          retention-days: 14
          path: nas-source-release
      - name: Build testable systems and reusable VM bundle roots
        if: steps.vm_bundle_handoff.outputs.cache_complete != 'true'
        run: |
          nix build .#nixosConfigurations.nas-ci-ready.config.system.build.toplevel --show-trace
          nix build .#nixosConfigurations.nas-qemu.config.system.build.toplevel --show-trace
          ./scripts/vm-bundles.sh build
      - name: Export missing Nix store bundles for downstream VMs
        if: steps.vm_bundle_handoff.outputs.cache_complete != 'true'
        env:
          NAS_BUNDLE_SKIP_BUILD: "1"
        run: ./scripts/vm-bundles.sh save-missing "$RUNNER_TEMP/vm-bundles"
      - name: Publish the exact Nix bundles used by this run
        if: steps.vm_bundle_handoff.outputs.cache_complete != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-bundle-handoff
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/vm-bundles/*.nar.gz
            ${{ runner.temp }}/vm-bundles/bundle-manifest.tsv
            ${{ runner.temp }}/vm-bundles/bundle-handoff.sha256

  cache-vm-bundles:
    name: Persist reusable Nix VM bundles
    if: >-
      always() && needs.build.result == 'success' &&
      needs.build.outputs.bundle_cache_complete != 'true'
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the exact bundles produced by the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bundle-handoff
          path: ${{ runner.temp }}/vm-bundles
      - name: Verify bundle handoff before cache persistence
        run: ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"
      - name: "Save reusable Nix store bundle: core"
        if: needs.build.outputs.cache_core_hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/core.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-core-${{ needs.build.outputs.key_core }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Save reusable Nix store bundle: identity"
        if: needs.build.outputs.cache_identity_hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/identity.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-identity-${{ needs.build.outputs.key_identity }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Save reusable Nix store bundle: observability"
        if: needs.build.outputs.cache_observability_hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/observability.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-observability-${{ needs.build.outputs.key_observability }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Save reusable Nix store bundle: storage"
        if: needs.build.outputs.cache_storage_hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/storage.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-storage-${{ needs.build.outputs.key_storage }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Save reusable Nix store bundle: ai"
        if: needs.build.outputs.cache_ai_hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/ai.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-ai-${{ needs.build.outputs.key_ai }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Save reusable Nix store bundle: vm-drivers"
        if: needs.build.outputs.cache_vm_drivers_hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/vm-drivers.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-vm-drivers-${{ needs.build.outputs.key_vm_drivers }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: Report cache persistence status
        if: always()
        env:
          CACHE_JOB_STATUS: ${{ job.status }}
        run: |
          echo "cache-vm-bundles status: $CACHE_JOB_STATUS"
          echo "Cache persistence is reusable acceleration; qualification evidence remains the build handoff."

  browser:
    name: Post-build deterministic Cockpit layout, XSS, and accessibility
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.test-tier == 'fast'))
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success'
        with:
          name: cockpit-bundle
          path: cockpit
      - name: Restore reviewed Cockpit build for fast tier
        id: browser-build-cache
        if: needs.build.result != 'success'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/dist
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-build-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json', 'cockpit/package.json', 'cockpit/build.js', 'cockpit/src/**') }}
      - name: Restore exact dependencies
        id: browser-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install dependencies on cache miss
        if: steps.browser-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Build production bundle for fast tier
        if: needs.build.result != 'success' && steps.browser-build-cache.outputs.cache-hit != 'true'
        run: npm --prefix cockpit run build
      - name: Verify the post-build Cockpit bundle
        run: |
          node cockpit/build.js --check
          node scripts/validate-cockpit-jsx.cjs
          node --test tests/js/*.test.mjs
      - name: Restore Playwright engines
        id: playwright-browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ env.CI_CACHE_SCHEMA }}-playwright-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install Playwright engines on cache miss
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npm --prefix cockpit exec -- playwright install chromium firefox webkit
      - name: Install Playwright system dependencies
        run: npm --prefix cockpit exec -- playwright install-deps chromium firefox webkit
      - name: Deterministic common XSS, overlap, formatting, layout, and accessibility probes
        env:
          NAS_BROWSER_SUITE: deterministic
        run: npm --prefix cockpit run test:browser
      - name: Retain browser failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            cockpit/playwright-report
            cockpit/test-results

  integration:
    name: Post-build full-stack QEMU integration (${{ matrix.vm }})
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.test-tier != 'fast'))
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 379
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - vm: unencrypted
            check: nas-vm
          - vm: encrypted
            check: nas-vm-encrypted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: "Restore exact cached Nix bundle: core"
        if: needs.build.outputs.bundle_cache_complete == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/core.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-core-${{ needs.build.outputs.key_core }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Restore exact cached Nix bundle: identity"
        if: needs.build.outputs.bundle_cache_complete == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/identity.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-identity-${{ needs.build.outputs.key_identity }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Restore exact cached Nix bundle: observability"
        if: needs.build.outputs.bundle_cache_complete == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/observability.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-observability-${{ needs.build.outputs.key_observability }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Restore exact cached Nix bundle: storage"
        if: needs.build.outputs.bundle_cache_complete == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/storage.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-storage-${{ needs.build.outputs.key_storage }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Restore exact cached Nix bundle: ai"
        if: needs.build.outputs.bundle_cache_complete == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/ai.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-ai-${{ needs.build.outputs.key_ai }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: "Restore exact cached Nix bundle: vm-drivers"
        if: needs.build.outputs.bundle_cache_complete == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vm-bundles/vm-drivers.nar.gz
          key: ${{ env.CI_CACHE_SCHEMA }}-vm-bundle-vm-drivers-${{ needs.build.outputs.key_vm_drivers }}${{ needs.build.outputs.bundle_cache_namespace }}
      - name: Download the exact Nix bundles used by the build
        if: needs.build.outputs.bundle_cache_complete != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bundle-handoff
          path: ${{ runner.temp }}/vm-bundles
      - name: Verify exact bundle handoff before import
        if: needs.build.outputs.bundle_cache_complete != 'true'
        run: ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"
      - name: Verify restored cached bundle archives
        if: needs.build.outputs.bundle_cache_complete == 'true'
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP"/vm-bundles/*.nar.gz; do
            gzip -t "$archive"
          done
      - name: Reassemble Nix store from the build handoff
        run: ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
      - name: Run ${{ matrix.vm }} NixOS VM integration tests
        run: nix build ".#checks.x86_64-linux.${{ matrix.check }}" --show-trace -L

  installer:
    name: Official-ISO install, reboot, and final-VM deterministic checks
    if: >-
      always() && needs.build.result == 'success' &&
      needs.browser.result == 'success' && needs.integration.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && (github.event.inputs.test-tier == 'full' || github.event.inputs.test-tier == 'installer')) ||
       (github.event_name != 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    needs: [integration, browser, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 489
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - name: Compute weekly installer epoch
        id: installer-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore only immutable installer media and extracted boot files
        id: installer-media
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/nixos-nas-qemu/*.iso
            ~/.cache/nixos-nas-qemu/*.sha256.remote
            ~/.cache/nixos-nas-qemu/iso-boot
          key: ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-${{ steps.installer-epoch.outputs.week }}-${{ hashFiles('scripts/qemu-test.sh') }}
          restore-keys: |
            ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Enable incremental Nix build and VM cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Restore exact final-browser dependencies
        id: installer-browser-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cockpit/node_modules
          key: ${{ env.CI_CACHE_SCHEMA }}-cockpit-node24-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install final-browser dependencies on cache miss
        if: steps.installer-browser-deps.outputs.cache-hit != 'true'
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Restore final-VM Playwright engines
        id: installer-playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ env.CI_CACHE_SCHEMA }}-playwright-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install final-VM Playwright engines on cache miss
        if: steps.installer-playwright.outputs.cache-hit != 'true'
        run: npm --prefix cockpit exec -- playwright install chromium firefox webkit
      - name: Install final-VM Playwright system dependencies
        run: npm --prefix cockpit exec -- playwright install-deps chromium firefox webkit
      - name: Install from the official NixOS ISO and reboot-test the appliance
        run: nix develop .#qemu-test -c ./scripts/qemu-test.sh installer
      - name: Final VM deterministic layout/accessibility/security checks
        run: nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#nodejs nixpkgs#python3 -c bash ./scripts/qemu-final-browser.sh
      - name: Retain final-VM browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-vm-browser-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: |
            cockpit/playwright-report
            cockpit/test-results
            ~/.cache/nixos-nas-qemu/state/browser-console.log

  # Generated source properties start only after deterministic integration.
  # Each shard delegates to the canonical smart-fuzz runner; Hypothesis owns
  # generation/shrinking and the executable shard is a one-pass contract check.
  source-fuzz:
    name: Final smart fuzz shard (${{ matrix.shard }})
    if: >-
      always() && needs.integration.result == 'success' && needs.browser.result == 'success' &&
      (needs.installer.result == 'success' || needs.installer.result == 'skipped') &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.test-tier == 'full' || github.event.inputs.test-tier == 'installer')))
    needs: [integration, browser, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [boundaries, properties, stateful, security, javascript, executable-contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.shard == 'javascript' || matrix.shard == 'executable-contracts'
        with:
          node-version: 24
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        if: matrix.shard == 'boundaries' || matrix.shard == 'properties' || matrix.shard == 'stateful' || matrix.shard == 'security'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable incremental Nix build cache
        if: matrix.shard == 'boundaries' || matrix.shard == 'properties' || matrix.shard == 'stateful' || matrix.shard == 'security'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Run smart fuzz shard
        run: |
          mkdir -p .fuzz-evidence
          ./scripts/run-fuzz.py --suite "${{ matrix.shard }}" --jobs 1 2>&1 | tee ".fuzz-evidence/${{ matrix.shard }}.log"
      - name: Retain source fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-fuzz-${{ matrix.shard }}-evidence
          if-no-files-found: error
          retention-days: 30
          path: .fuzz-evidence/${{ matrix.shard }}.log

  installed-command-fuzz:
    name: Final installed-command and HTTP adversarial checks
    needs: [installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - name: Compute weekly installer epoch
        id: installed-fuzz-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore immutable installer media
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/nixos-nas-qemu/*.iso
            ~/.cache/nixos-nas-qemu/*.sha256.remote
            ~/.cache/nixos-nas-qemu/iso-boot
          key: ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-${{ steps.installed-fuzz-epoch.outputs.week }}-${{ hashFiles('scripts/qemu-test.sh') }}
          restore-keys: |
            ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Enable incremental Nix build and VM cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Provision isolated installed appliance
        run: nix develop .#qemu-test -c ./scripts/qemu-test.sh installer
      - name: Run installed-command and curl HTTP adversarial checks
        env:
          NAS_FINAL_VM_WORKLOAD: installed-command-fuzz
          NAS_INSTALLED_FUZZ_OUT: installed-command-fuzz.json
          NAS_HTTP_ADVERSARIAL_OUT: http-adversarial.json
        run: nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#python3 -c bash ./scripts/qemu-final-browser.sh
      - name: Retain installed-command and HTTP adversarial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-command-fuzz-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            installed-command-fuzz.json
            http-adversarial.json

  zap-fuzz:
    name: Final installed-VM active ZAP fuzz
    needs: [installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - name: Compute weekly installer epoch
        id: zap-fuzz-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore immutable installer media
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/nixos-nas-qemu/*.iso
            ~/.cache/nixos-nas-qemu/*.sha256.remote
            ~/.cache/nixos-nas-qemu/iso-boot
          key: ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-${{ steps.zap-fuzz-epoch.outputs.week }}-${{ hashFiles('scripts/qemu-test.sh') }}
          restore-keys: |
            ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Enable incremental Nix build and VM cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Provision isolated installed appliance
        run: nix develop .#qemu-test -c ./scripts/qemu-test.sh installer
      - name: Run state-aware active ZAP scans
        env:
          NAS_FINAL_VM_WORKLOAD: zap-fuzz
          NAS_ZAP_IMAGE: ${{ vars.NAS_ZAP_IMAGE }}
          NAS_ZAP_CONFIRM_ACTIVE: "1"
          NAS_ZAP_OUT_DIR: zap-report
          NAS_ZAP_AUTOMATION_MINUTES: "90"
          NAS_ZAP_BROWSER_WORKERS: "2"
        run: |
          test -n "$NAS_ZAP_IMAGE"
          nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#python3 -c bash ./scripts/qemu-final-browser.sh
      - name: Retain active ZAP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-fuzz-evidence
          if-no-files-found: error
          retention-days: 30
          path: zap-report

  summary:
    name: Pipeline summary
    if: always()
    needs: [test, test-nonroot, security, caddy-validate, static, dependency-audit, coverage-diff, build, cache-vm-bundles, browser, integration, installer, source-fuzz, installed-command-fuzz, zap-fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Emit summary and fail on any real failure
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          TEST_TIER: ${{ github.event.inputs.test-tier }}
        run: python3 scripts/ci-summary.py
