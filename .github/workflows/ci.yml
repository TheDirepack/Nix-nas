name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      test-tier:
        description: Test scope for on-demand runs; full includes installer and deterministic installed-VM checks; fuzzing is local-only
        type: choice
        required: false
        default: fast
        options: [fast, full, installer]
      force-cache-miss:
        description: Run the full cache-miss bundle handoff and persistence path in an isolated cache namespace
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CACHE_SCHEMA: ci-v8-fanout-npm-system-handoff

jobs:
  # Stage 1: run only prerequisites shared by every qualification branch.
  # Realizing the pinned test shell here warms the shared Nix cache before the
  # independent Nix-heavy checks fan out onto separate runners.
  prerequisites:
    name: Shared qualification prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize shared diagnostics
        run: |
          rm -rf ci-logs
          mkdir -p ci-logs
          : > ci-logs/shared-results.tsv
      - name: Set up shared Nix environment
        id: setup-nix
        continue-on-error: true
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Realize pinned test toolchain once
        id: warm-test-shell
        if: always() && steps.setup-nix.outcome == 'success'
        continue-on-error: true
        run: nix develop .#test -c true
      - name: Run repository and test contracts
        id: shared
        if: always() && steps.setup-nix.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci-qualification.sh shared
      - name: Retain shared diagnostic logs on failure
        if: >-
          always() &&
          (steps.setup-nix.outcome != 'success' ||
           steps.warm-test-shell.outcome != 'success' ||
           steps.shared.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-shared-logs
          if-no-files-found: error
          retention-days: 3
          path: ci-logs
      - name: Report shared prerequisite failures
        if: always()
        env:
          CI_REPORT_TITLE: Shared qualification prerequisites
        run: |
          python3 scripts/ci-check-report.py \
            --results ci-logs/shared-results.tsv \
            --tail-lines 30 \
            "setup-nix=${{ steps.setup-nix.outcome }}" \
            "warm-test-shell=${{ steps.warm-test-shell.outcome }}" \
            "shared=${{ steps.shared.outcome }}"

  # Stage 2: independent checks fan out after shared source/tooling contracts.
  # They still run when a shared contract fails so one attempt reports every
  # inexpensive problem before the aggregate gate blocks expensive builds.
  static:
    name: Static analysis and configuration
    needs: [prerequisites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize static diagnostics
        run: |
          mkdir -p ci-logs
          : > ci-logs/static-results.tsv
      - name: Set up Nix
        id: setup-nix
        continue-on-error: true
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run all static/configuration checks
        id: checks
        if: always() && steps.setup-nix.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci-qualification.sh static
      - name: Retain static diagnostic logs on failure
        if: >-
          always() &&
          (steps.setup-nix.outcome != 'success' || steps.checks.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-static-logs
          if-no-files-found: error
          retention-days: 3
          path: ci-logs
      - name: Report static failures
        if: always()
        env:
          CI_REPORT_TITLE: Static analysis and configuration
        run: |
          python3 scripts/ci-check-report.py \
            --results ci-logs/static-results.tsv \
            --tail-lines 30 \
            "setup-nix=${{ steps.setup-nix.outcome }}" \
            "static=${{ steps.checks.outcome }}"

  unit:
    name: Unit, coverage, and maintainer contracts
    needs: [prerequisites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize unit diagnostics
        run: |
          mkdir -p ci-logs
          : > ci-logs/unit-results.tsv
      - name: Set up Nix
        id: setup-nix
        continue-on-error: true
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unit and coverage checks
        id: checks
        if: always() && steps.setup-nix.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci-qualification.sh unit
      - name: Retain current coverage for PR baseline comparison
        if: always() && hashFiles('coverage.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          if-no-files-found: error
          retention-days: 1
          path: coverage.json
      - name: Retain unit diagnostic logs on failure
        if: >-
          always() &&
          (steps.setup-nix.outcome != 'success' || steps.checks.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-unit-logs
          if-no-files-found: error
          retention-days: 3
          path: ci-logs
      - name: Report unit failures
        if: always()
        env:
          CI_REPORT_TITLE: Unit, coverage, and maintainer contracts
        run: |
          python3 scripts/ci-check-report.py \
            --results ci-logs/unit-results.tsv \
            --tail-lines 30 \
            "setup-nix=${{ steps.setup-nix.outcome }}" \
            "unit=${{ steps.checks.outcome }}"

  security:
    name: Security and generated configuration
    needs: [prerequisites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize security diagnostics
        run: |
          mkdir -p ci-logs
          : > ci-logs/security-results.tsv
      - name: Set up Nix
        id: setup-nix
        continue-on-error: true
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run security checks
        id: checks
        if: always() && steps.setup-nix.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci-qualification.sh security
      - name: Retain security diagnostic logs on failure
        if: >-
          always() &&
          (steps.setup-nix.outcome != 'success' || steps.checks.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-security-logs
          if-no-files-found: error
          retention-days: 3
          path: ci-logs
      - name: Report security failures
        if: always()
        env:
          CI_REPORT_TITLE: Security and generated configuration
        run: |
          python3 scripts/ci-check-report.py \
            --results ci-logs/security-results.tsv \
            --tail-lines 30 \
            "setup-nix=${{ steps.setup-nix.outcome }}" \
            "security=${{ steps.checks.outcome }}"

  nonroot:
    name: Unprivileged hermeticity
    needs: [prerequisites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize hermeticity diagnostics
        run: |
          mkdir -p ci-logs
          : > ci-logs/nonroot-results.tsv
      - name: Set up Nix
        id: setup-nix
        continue-on-error: true
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unprivileged suite
        id: checks
        if: always() && steps.setup-nix.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci-qualification.sh nonroot
      - name: Retain hermeticity diagnostic logs on failure
        if: >-
          always() &&
          (steps.setup-nix.outcome != 'success' || steps.checks.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-nonroot-logs
          if-no-files-found: error
          retention-days: 3
          path: ci-logs
      - name: Report hermeticity failures
        if: always()
        env:
          CI_REPORT_TITLE: Unprivileged hermeticity
        run: |
          python3 scripts/ci-check-report.py \
            --results ci-logs/nonroot-results.tsv \
            --tail-lines 30 \
            "setup-nix=${{ steps.setup-nix.outcome }}" \
            "nonroot=${{ steps.checks.outcome }}"

  cockpit:
    name: Cockpit source, dependencies, and production bundle
    needs: [prerequisites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize Cockpit diagnostics
        run: |
          mkdir -p ci-logs
          : > ci-logs/cockpit-results.tsv
      - name: Set up Node 24 with npm cache
        id: setup-node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install exact Node dependencies
        id: node-install
        if: always() && steps.setup-node.outcome == 'success'
        continue-on-error: true
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Run Cockpit checks and build once
        id: checks
        if: >-
          always() && steps.setup-node.outcome == 'success' &&
          steps.node-install.outcome == 'success'
        continue-on-error: true
        run: bash scripts/ci-qualification.sh cockpit
      - name: Publish reviewed Cockpit bundle
        if: always() && hashFiles('cockpit/dist/build-meta.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cockpit-bundle
          if-no-files-found: error
          retention-days: 1
          path: |
            cockpit/package-lock.json
            cockpit/dist
      - name: Retain Cockpit diagnostic logs on failure
        if: >-
          always() &&
          (steps.setup-node.outcome != 'success' ||
           steps.node-install.outcome != 'success' ||
           steps.checks.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-cockpit-logs
          if-no-files-found: error
          retention-days: 3
          path: ci-logs
      - name: Report Cockpit failures
        if: always()
        env:
          CI_REPORT_TITLE: Cockpit source, dependencies, and production bundle
        run: |
          python3 scripts/ci-check-report.py \
            --results ci-logs/cockpit-results.tsv \
            --tail-lines 30 \
            "setup-node=${{ steps.setup-node.outcome }}" \
            "node-install=${{ steps.node-install.outcome }}" \
            "cockpit=${{ steps.checks.outcome }}"

  # Coverage comparison starts as soon as the unit branch completes. If the
  # current unit branch failed before producing coverage, fail quickly instead
  # of spending minutes constructing a baseline that cannot be compared.
  coverage-diff:
    name: PR coverage drift
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    needs: [unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download current coverage
        id: current-coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.current-coverage.outcome == 'success'
        with:
          ref: main
          path: main
      - name: Resolve main baseline revision
        id: main-baseline
        if: steps.current-coverage.outcome == 'success'
        run: echo "sha=$(git -C main rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore main coverage baseline
        id: main-coverage
        if: steps.current-coverage.outcome == 'success'
        continue-on-error: true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: main-coverage.json
          key: ${{ env.CI_CACHE_SCHEMA }}-coverage-main-${{ runner.os }}-${{ steps.main-baseline.outputs.sha }}-${{ hashFiles('scripts/prepare-coverage-baseline.py') }}
      - name: Set up Nix for uncached baseline
        id: baseline-nix
        if: >-
          steps.current-coverage.outcome == 'success' &&
          steps.main-coverage.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build main coverage baseline
        id: baseline-build
        continue-on-error: true
        if: >-
          steps.current-coverage.outcome == 'success' &&
          steps.main-coverage.outputs.cache-hit != 'true' &&
          steps.baseline-nix.outcome == 'success'
        working-directory: main
        run: |
          python3 ../scripts/prepare-coverage-baseline.py .
          nix develop .#test -c ./scripts/run-unit-tests.py \
            --coverage ../main-coverage.json --quiet --jobs 4 \
            --exclude test_maintainer_core.py \
            --exclude test_maintainer_matrix.py \
            --exclude test_maintainer_release.py \
            --exclude test_contract_tooling.py \
            --exclude test_fuzz_boundaries.py \
            --exclude test_property_invariants.py \
            --exclude test_secret_security_fuzz.py
      - name: Compare current coverage with main
        id: drift
        continue-on-error: true
        if: steps.current-coverage.outcome == 'success'
        run: |
          test -s coverage.json
          test -s main-coverage.json
          python3 scripts/check-coverage.py \
            coverage.json --baseline main-coverage.json --total-floor 66
      - name: Report coverage baseline failures
        if: always()
        env:
          CI_REPORT_TITLE: PR coverage comparison
        run: |
          python3 scripts/ci-check-report.py \
            "current-coverage=${{ steps.current-coverage.outcome }}" \
            "baseline-nix=${{ steps.baseline-nix.outcome }}" \
            "baseline-build=${{ steps.baseline-build.outcome }}" \
            "coverage-drift=${{ steps.drift.outcome }}"

  # One lightweight gate joins every parallel qualification branch. Detailed
  # failure context already lives on the failing branch and in its log artifact.
  qualification:
    name: Qualification gate
    if: ${{ !cancelled() }}
    needs: [prerequisites, static, unit, security, nonroot, cockpit, coverage-diff]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Summarize parallel qualification
        env:
          CI_REPORT_TITLE: Parallel qualification gate
        run: |
          python3 scripts/ci-check-report.py \
            "prerequisites=${{ needs.prerequisites.result }}" \
            "static=${{ needs.static.result }}" \
            "unit=${{ needs.unit.result }}" \
            "security=${{ needs.security.result }}" \
            "nonroot=${{ needs.nonroot.result }}" \
            "cockpit=${{ needs.cockpit.result }}" \
            "coverage-diff=${{ needs.coverage-diff.result }}"

  # Stage 3: source packaging still runs on PRs, but the expensive exact Nix
  # handoff is produced only when a later integration/release consumer needs it.
  prepare:
    name: Prepare reusable build handoff
    if: ${{ !cancelled() && needs.qualification.result == 'success' }}
    needs: [qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore reviewed Cockpit bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - name: Set up Nix for packaging and reusable handoff
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast'
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Select VM bundle cache namespace
        if: >-
          github.event_name == 'schedule' || github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.test-tier != 'fast')
        id: vm-bundle-namespace
        env:
          FORCE_CACHE_MISS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force-cache-miss == 'true' }}
        run: |
          if [[ "$FORCE_CACHE_MISS" == true ]]; then
            printf 'suffix=-forced-%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            printf 'suffix=\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore/build once and publish complete Nix handoff
        if: >-
          github.event_name == 'schedule' || github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.test-tier != 'fast')
        uses: ./.github/actions/prepare-vm-handoff
        with:
          cache-schema: ${{ env.CI_CACHE_SCHEMA }}
          cache-suffix: ${{ steps.vm-bundle-namespace.outputs.suffix }}
      - name: Restore verified source archive
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast'
        id: source-archive-cache
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: nas-source-release
          key: ${{ env.CI_CACHE_SCHEMA }}-source-archive-${{ github.sha }}${{ steps.vm-bundle-namespace.outputs.suffix }}
      - name: Package and verify as an untrusted consumer
        if: >-
          (github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast') &&
          steps.source-archive-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/nas-source-release"
          rm -rf -- "$out"
          mkdir -p "$out"
          NAS_PREFLIGHT_SKIP_TESTS=1 ./scripts/package-release.sh --source-only "$out"
          archive=$(find "$out" -mindepth 2 -maxdepth 2 -type f -name '*.zip' -print -quit)
          test -n "$archive"
          extract="$RUNNER_TEMP/extracted-source"
          rm -rf -- "$extract"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          root=$(find "$extract" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          (cd "$root" && sha256sum -c MANIFEST.sha256)
          (
            cd "$root"
            NAS_PREFLIGHT_VERIFY_MANIFEST=1 \
              NAS_PREFLIGHT_SKIP_TESTS=1 \
              NAS_PREFLIGHT_SKIP_TOOLING=1 \
              NAS_PREFLIGHT_SKIP_NIX=1 \
              ./scripts/preflight.sh
          )
      - name: Verify restored source archive
        if: >-
          (github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast') &&
          steps.source-archive-cache.outputs.cache-hit == 'true'
        run: |
          archive=$(find nas-source-release -mindepth 2 -maxdepth 2 -type f -name '*.zip' -print -quit)
          test -n "$archive"
          unzip -tq "$archive"
      - name: Save verified source archive
        if: >-
          (github.event_name != 'workflow_dispatch' || github.event.inputs.test-tier != 'fast') &&
          steps.source-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: nas-source-release
          key: ${{ env.CI_CACHE_SCHEMA }}-source-archive-${{ github.sha }}${{ steps.vm-bundle-namespace.outputs.suffix }}

  # Stage 4a: Playwright owns internal parallelism, so use one browser runner.
  browser:
    name: Deterministic Cockpit browser qualification
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - name: Install exact dependencies
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Restore Playwright engines
        id: playwright-browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ env.CI_CACHE_SCHEMA }}-playwright-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install Playwright engines on cache miss
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npm --prefix cockpit exec -- playwright install chromium firefox webkit
      - name: Install Playwright system dependencies
        run: npm --prefix cockpit exec -- playwright install-deps chromium firefox webkit
      - name: Verify reviewed Cockpit handoff
        run: |
          node cockpit/build.js --check
          node scripts/validate-cockpit-jsx.cjs
      - name: Run complete deterministic browser suite
        env:
          NAS_BROWSER_SUITE: deterministic
        run: npm --prefix cockpit run test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            cockpit/playwright-report
            cockpit/test-results

  # Stage 4b: only the two expensive VM variants remain job-level parallelism.
  integration:
    name: Full-stack QEMU integration (${{ matrix.vm }})
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.test-tier != 'fast'))
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - vm: unencrypted
            check: nas-vm
          - vm: encrypted
            check: nas-vm-encrypted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bundle-handoff
          path: ${{ runner.temp }}/vm-bundles
      - name: Set up Nix with KVM
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-kvm: "true"
      - name: Verify and import prepared Nix handoff
        run: |
          ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"
          bash scripts/system-handoff.sh verify "$RUNNER_TEMP/vm-bundles"
          ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
          bash scripts/system-handoff.sh import "$RUNNER_TEMP/vm-bundles"
      - name: Run ${{ matrix.vm }} NixOS VM integration
        run: nix build ".#checks.x86_64-linux.${{ matrix.check }}" --show-trace -L

  # Stage 5: official-media installation reuses the prepared products.
  installer:
    name: Official-ISO install, reboot, and final-VM checks
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.browser.result == 'success' && needs.integration.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.test-tier == 'full' || github.event.inputs.test-tier == 'installer')) ||
       (github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [prepare, browser, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bundle-handoff
          path: ${{ runner.temp }}/vm-bundles
      - name: Compute weekly installer epoch
        id: installer-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore immutable installer media
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/nixos-nas-qemu/*.iso
            ~/.cache/nixos-nas-qemu/*.sha256.remote
            ~/.cache/nixos-nas-qemu/iso-boot
          key: ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-${{ steps.installer-epoch.outputs.week }}-${{ hashFiles('scripts/qemu-test.sh') }}
          restore-keys: |
            ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-
      - name: Set up Nix with KVM
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-kvm: "true"
      - name: Verify and import prepared Nix handoff
        run: |
          ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"
          bash scripts/system-handoff.sh verify "$RUNNER_TEMP/vm-bundles"
          ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
          bash scripts/system-handoff.sh import "$RUNNER_TEMP/vm-bundles"
      - name: Install exact final-browser dependencies
        run: npm --prefix cockpit ci --no-audit --no-fund
      - name: Restore final-VM Playwright engines
        id: installer-playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ env.CI_CACHE_SCHEMA }}-playwright-${{ runner.os }}-${{ hashFiles('cockpit/package-lock.json') }}
      - name: Install final-VM Playwright engines on cache miss
        if: steps.installer-playwright.outputs.cache-hit != 'true'
        run: npm --prefix cockpit exec -- playwright install chromium firefox webkit
      - name: Install final-VM Playwright system dependencies
        run: npm --prefix cockpit exec -- playwright install-deps chromium firefox webkit
      - name: Install from official NixOS media and reboot-test
        run: nix develop .#qemu-test -c ./scripts/qemu-test.sh installer
      - name: Final VM browser, layout, accessibility, and security checks
        run: nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#nodejs nixpkgs#python3 -c bash ./scripts/qemu-final-browser.sh
      - name: Collect final-VM console evidence
        if: always()
        run: |
          mkdir -p final-vm-evidence
          cp ~/.cache/nixos-nas-qemu/state/browser-console.log \
            final-vm-evidence/browser-console.log 2>/dev/null || true
      - name: Retain final-VM failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-vm-browser-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            cockpit/playwright-report
            cockpit/test-results
            final-vm-evidence

  # Stage 6a: run-fuzz.py owns safe internal parallelism.
  source-fuzz:
    name: Final source fuzz and property qualification
    if: >-
      !cancelled() && needs.integration.result == 'success' &&
      needs.browser.result == 'success' &&
      (needs.installer.result == 'success' || needs.installer.result == 'skipped') &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [integration, browser, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run all smart-fuzz suites with internal workers
        run: |
          mkdir -p fuzz-evidence
          set -o pipefail
          nix develop .#test -c ./scripts/run-fuzz.py --jobs 6 \
            2>&1 | tee fuzz-evidence/source-fuzz.log
      - name: Retain source fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-fuzz-evidence
          if-no-files-found: error
          retention-days: 7
          path: fuzz-evidence/source-fuzz.log

  # Stage 6b: provision once, then run both installed adversarial workloads.
  installed-security:
    name: Installed appliance adversarial qualification
    if: >-
      !cancelled() && needs.installer.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [installer, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cockpit-bundle
          path: cockpit
      - run: git add -f cockpit/package-lock.json cockpit/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vm-bundle-handoff
          path: ${{ runner.temp }}/vm-bundles
      - name: Compute weekly installer epoch
        id: security-installer-epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore immutable installer media
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/nixos-nas-qemu/*.iso
            ~/.cache/nixos-nas-qemu/*.sha256.remote
            ~/.cache/nixos-nas-qemu/iso-boot
          key: ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-${{ steps.security-installer-epoch.outputs.week }}-${{ hashFiles('scripts/qemu-test.sh') }}
          restore-keys: |
            ${{ env.CI_CACHE_SCHEMA }}-nixos-26.05-media-${{ runner.os }}-
      - name: Set up Nix with KVM
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-kvm: "true"
      - name: Verify and import prepared Nix handoff
        run: |
          ./scripts/vm-bundles.sh verify-handoff "$RUNNER_TEMP/vm-bundles"
          bash scripts/system-handoff.sh verify "$RUNNER_TEMP/vm-bundles"
          ./scripts/vm-bundles.sh import "$RUNNER_TEMP/vm-bundles"
          bash scripts/system-handoff.sh import "$RUNNER_TEMP/vm-bundles"
      - name: Provision installed appliance once
        run: nix develop .#qemu-test -c ./scripts/qemu-test.sh installer
      - name: Installed-command and HTTP adversarial checks
        id: installed-command
        continue-on-error: true
        env:
          NAS_FINAL_VM_WORKLOAD: installed-command-fuzz
          NAS_INSTALLED_FUZZ_OUT: installed-command-fuzz.json
          NAS_HTTP_ADVERSARIAL_OUT: http-adversarial.json
        run: nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#python3 -c bash ./scripts/qemu-final-browser.sh
      - name: State-aware active ZAP qualification
        id: zap
        continue-on-error: true
        env:
          NAS_FINAL_VM_WORKLOAD: zap-fuzz
          NAS_ZAP_IMAGE: ${{ vars.NAS_ZAP_IMAGE }}
          NAS_ZAP_CONFIRM_ACTIVE: "1"
          NAS_ZAP_OUT_DIR: zap-report
          NAS_ZAP_AUTOMATION_MINUTES: "90"
          NAS_ZAP_BROWSER_WORKERS: "2"
        run: |
          test -n "$NAS_ZAP_IMAGE"
          nix shell nixpkgs#qemu nixpkgs#openssh nixpkgs#curl nixpkgs#python3 \
            -c bash ./scripts/qemu-final-browser.sh
      - name: Collect installed-security console evidence
        if: always()
        run: |
          mkdir -p installed-security-logs
          cp ~/.cache/nixos-nas-qemu/state/browser-console.log \
            installed-security-logs/browser-console.log 2>/dev/null || true
      - name: Retain installed security failure evidence
        if: >-
          always() &&
          (steps.installed-command.outcome != 'success' || steps.zap.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-security-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            installed-command-fuzz.json
            http-adversarial.json
            zap-report
            installed-security-logs
      - name: Report all installed-security failures
        if: always()
        env:
          CI_REPORT_TITLE: Installed appliance adversarial qualification
        run: |
          python3 scripts/ci-check-report.py \
            "installed-command=${{ steps.installed-command.outcome }}" \
            "zap=${{ steps.zap.outcome }}"

  summary:
    name: Pipeline summary
    if: ${{ !cancelled() }}
    needs: [prerequisites, static, unit, security, nonroot, cockpit, coverage-diff, qualification, prepare, browser, integration, installer, source-fuzz, installed-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Emit summary and fail on incomplete qualification
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          TEST_TIER: ${{ github.event.inputs.test-tier }}
        run: python3 scripts/ci-summary.py

  # Repository hygiene is part of the existing CI rather than another workflow.
  # It runs after successful or failed main/scheduled qualification, but never on
  # cancellation and never gives pull-request jobs an Actions write token.
  maintenance:
    name: Actions history and cache maintenance
    needs: [summary]
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prune obsolete workflow history and repo-owned caches
        id: prune
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/actions-maintenance"
          rm -rf -- "$work"
          mkdir -p "$work"

          # The default branch defines the only workflow names that should stay
          # visible long-term. Deleted one-shot/agent workflows have their
          # completed run history removed, which also removes their sidebar noise.
          gh api "/repos/$REPOSITORY/contents/.github/workflows?ref=$DEFAULT_BRANCH" \
            --jq '.[] | select(.type == "file") | .path' | sort -u > "$work/active-workflows"
          gh api --paginate "/repos/$REPOSITORY/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, .created_at] | @tsv' > "$work/completed-runs"

          active_cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          deleted_runs=0
          while IFS=$'\t' read -r run_id workflow_path created_at; do
            [[ -n "$run_id" && "$run_id" != "$CURRENT_RUN_ID" ]] || continue
            remove=false
            if ! grep -Fxq -- "$workflow_path" "$work/active-workflows"; then
              remove=true
            elif [[ -n "$created_at" && "$created_at" < "$active_cutoff" ]]; then
              remove=true
            fi
            if [[ "$remove" == true ]]; then
              gh api --method DELETE "/repos/$REPOSITORY/actions/runs/$run_id" >/dev/null
              deleted_runs=$((deleted_runs + 1))
              (( deleted_runs < 200 )) || break
            fi
          done < "$work/completed-runs"

          # Only NAS-owned ci-* keys are eligible. setup-node, Determinate and
          # any other third-party caches are deliberately outside this policy.
          gh api --paginate "/repos/$REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .key, .last_accessed_at] | @tsv' > "$work/caches"
          coverage_cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          default_cutoff="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          media_cutoff="$(date -u -d '21 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          bundle_cutoff="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          deleted_caches=0
          while IFS=$'\t' read -r cache_id key accessed_at; do
            [[ "$key" == ci-* ]] || continue
            remove=false
            cutoff="$default_cutoff"
            if [[ "$key" != "$CI_CACHE_SCHEMA"-* ]]; then
              remove=true
            elif [[ "$key" == *-forced-* || "$key" == "$CI_CACHE_SCHEMA"-source-archive-* ]]; then
              remove=true
            else
              case "$key" in
                "$CI_CACHE_SCHEMA"-coverage-main-*) cutoff="$coverage_cutoff" ;;
                "$CI_CACHE_SCHEMA"-playwright-*) cutoff="$default_cutoff" ;;
                "$CI_CACHE_SCHEMA"-nixos-*-media-*) cutoff="$media_cutoff" ;;
                "$CI_CACHE_SCHEMA"-vm-bundle-*) cutoff="$bundle_cutoff" ;;
              esac
              [[ -z "$accessed_at" || "$accessed_at" < "$cutoff" ]] && remove=true
            fi
            if [[ "$remove" == true ]]; then
              gh api --method DELETE "/repos/$REPOSITORY/actions/caches/$cache_id" >/dev/null
              deleted_caches=$((deleted_caches + 1))
              (( deleted_caches < 200 )) || break
            fi
          done < "$work/caches"

          {
            echo "### Actions storage maintenance"
            echo
            echo "- Active workflow files: $(wc -l < "$work/active-workflows")"
            echo "- Deleted completed workflow runs: $deleted_runs"
            echo "- Deleted NAS-owned caches: $deleted_caches"
            echo "- Active workflow history retention: 7 days"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Warn without blocking releases if maintenance fails
        if: always() && steps.prune.outcome != 'success'
        run: |
          echo "::warning title=Actions maintenance::Workflow/cache cleanup failed; qualification results remain authoritative and the next main/scheduled run will retry cleanup."
