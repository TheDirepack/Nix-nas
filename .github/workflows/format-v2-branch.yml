name: Format V2 branch

on:
  push:
    branches:
      - agent/managed-services-v2-simplify-v2

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/managed-services-v2-simplify-v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Format JavaScript and JSX
        run: >-
          npx --yes prettier@3.8.3 --write
          "cockpit/src/**/*.{js,jsx,scss}"
          "cockpit/e2e/*.mjs"
          "tests/js/*.mjs"
          prettier.config.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cockpit/src cockpit/e2e tests/js prettier.config.mjs
          git commit -m "Format frontend sources with Prettier"
          git push origin HEAD:agent/managed-services-v2-simplify-v2
