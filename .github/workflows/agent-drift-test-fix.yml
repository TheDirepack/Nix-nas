name: Agent drift test fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/managed-services-v2-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/managed-services-v2-core
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix V2 operation-state assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_v2_cockpit_api_drift.py')
          text = path.read_text()
          old = '        self.assertIn("managed-service-policy", result["conflictsByAction"] if "managed-service-policy" in result["conflictsByAction"] else result["conflictsByAction"])\n'
          new = '        self.assertEqual(result["conflictsByAction"]["identity-sync"], ["identity"])\n'
          if old not in text:
              raise SystemExit('stale operation-state assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          nix shell nixpkgs#ruff -c ruff format tests/test_v2_cockpit_api_drift.py
          nix shell nixpkgs#ruff -c ruff check tests/test_v2_cockpit_api_drift.py
          nix develop .#test -c pyright --project pyproject.toml
          nix develop .#test -c python3 -m unittest tests.test_v2_cockpit_api_drift -v
      - name: Commit tested assertion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v2_cockpit_api_drift.py
          git diff --cached --quiet && exit 0
          git commit -m "test: align operation-state drift coverage with V2"
          git push origin HEAD:agent/managed-services-v2-core
