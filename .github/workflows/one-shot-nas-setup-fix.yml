name: One-shot setup source cleanup

on:
  push:
    branches:
      - agent/managed-services-v2-simplify-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/managed-services-v2-simplify-v2
      - name: Apply guarded source cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("services/nas_setup.py")
          text = path.read_text(encoding="utf-8")
          bad = '                diagnostic(f"Unable to remove setup application: {exc}")'
          good = '                progress(f"Unable to remove setup application: {exc}")'
          if text.count(bad) != 1:
              raise SystemExit(f"expected exactly one stale diagnostic call, found {text.count(bad)}")
          if text.count('SETUP_APPLICATION_SLUG = "nas-setup"') != 2:
              raise SystemExit("expected exactly two duplicated setup application declarations")
          text = text.replace(bad, good, 1)

          first = text.index("# Explicit setup application for first run.")
          second = text.index("# Explicit setup application for first run.", first + 1)
          end = text.index('BOOTSTRAP_ADMIN_USER = "nas-bootstrap"', second)
          text = text[:second] + text[end:]
          if text.count('SETUP_APPLICATION_SLUG = "nas-setup"') != 1:
              raise SystemExit("setup application declaration was not deduplicated")
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/one-shot-nas-setup-fix.yml").unlink()
          PY
      - name: Commit source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/nas_setup.py .github/workflows/one-shot-nas-setup-fix.yml
          git commit -m 'fix(setup): use existing progress logger'
          git push origin HEAD:agent/managed-services-v2-simplify-v2
