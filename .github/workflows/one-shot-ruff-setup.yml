name: One-shot Ruff setup formatter

on:
  push:
    branches:
      - agent/managed-services-v2-simplify-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/managed-services-v2-simplify-v2
      - name: Format setup source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("services/nas_setup.py")
          text = path.read_text(encoding="utf-8")
          needle = 'pathlib.Path(os.environ.get("NAS_AUTHENTIK_BOOTSTRAP_TOKEN_FILE", "/run/nas-secrets/authentik/bootstrap-token"))'
          if text.count(needle) != 1:
              raise SystemExit(f"expected one Ruff target expression, found {text.count(needle)}")
          text = text.replace(
              needle,
              'pathlib.Path(\n            os.environ.get("NAS_AUTHENTIK_BOOTSTRAP_TOKEN_FILE", "/run/nas-secrets/authentik/bootstrap-token")\n        )',
              1,
          )
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/one-shot-ruff-setup.yml").unlink()
          PY
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/nas_setup.py .github/workflows/one-shot-ruff-setup.yml
          git commit -m 'style(setup): format Authentik token paths'
          git push origin HEAD:agent/managed-services-v2-simplify-v2
