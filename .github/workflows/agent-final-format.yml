name: Agent final test formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/managed-services-v2-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/managed-services-v2-core
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply canonical Ruff formatting
        run: |
          nix shell nixpkgs#ruff -c ruff format tests/test_v2_common_drift_coverage.py tests/test_v2_setup_drift_coverage.py
          nix shell nixpkgs#ruff -c ruff check services tests scripts
          nix shell nixpkgs#ruff -c ruff format --check services tests scripts
          nix develop .#test -c pyright --project pyproject.toml
          nix develop .#test -c python3 -m unittest tests.test_v2_common_drift_coverage tests.test_v2_setup_drift_coverage -v
      - name: Commit tested formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v2_common_drift_coverage.py tests/test_v2_setup_drift_coverage.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format final coverage drift tests"
          git push origin HEAD:agent/managed-services-v2-core
