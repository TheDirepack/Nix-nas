name: Agent V2 coverage and Prettier

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/managed-services-v2-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/managed-services-v2-core
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Canonical formatting
        run: |
          sed -i '/^import os$/d' tests/test_v2_identity_sync_coverage.py
          nix shell nixpkgs#ruff -c ruff format tests/test_v2_identity_model_coverage.py tests/test_v2_identity_sync_coverage.py
          nix shell nixpkgs#prettier -c prettier --write cockpit/src/app.jsx cockpit/src/view-model.js tests/js/view-model.test.mjs
      - name: Rebuild and validate Cockpit
        run: |
          npm --prefix cockpit ci --no-audit --no-fund
          npm --prefix cockpit run build
          node cockpit/build.js --check
          node --test tests/js/*.test.mjs
      - name: Measure current fast-suite coverage
        run: |
          nix develop .#test -c ./scripts/run-unit-tests.py --coverage coverage.json --quiet --jobs 4 \
            --exclude test_maintainer_core.py \
            --exclude test_maintainer_matrix.py \
            --exclude test_maintainer_release.py \
            --exclude test_contract_tooling.py \
            --exclude test_fuzz_boundaries.py \
            --exclude test_property_invariants.py \
            --exclude test_secret_security_fuzz.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('coverage.json').read_text())
          print('=== SERVICE COVERAGE ===')
          for path, row in sorted(report['files'].items()):
              if path.startswith('services/'):
                  print(f"{path} {row['summary']['percent_covered']:.1f}")
          print(f"TOTAL {report['totals']['percent_covered']:.1f}")
          print('=== END SERVICE COVERAGE ===')
          PY
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cockpit/src/app.jsx cockpit/src/view-model.js tests/js/view-model.test.mjs cockpit/dist cockpit/package-lock.json tests/test_v2_identity_model_coverage.py tests/test_v2_identity_sync_coverage.py
          git diff --cached --quiet && exit 0
          git commit -m "style: apply canonical test and frontend formatting"
          git push origin HEAD:agent/managed-services-v2-core