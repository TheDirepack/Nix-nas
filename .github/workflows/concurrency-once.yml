name: One-shot CI concurrency hardening

on:
  push:
    branches: [agent/automated-merge-releases]

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Nix
        uses: ./.github/actions/setup-nix-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Protect main CI runs and add regression coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          open_expr = "$" + "{{"
          close_expr = "}}"
          workflow_path = Path(".github/workflows/ci.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old = (
              "concurrency:\n"
              f"  group: {open_expr} github.workflow {close_expr}-{open_expr} github.ref {close_expr}\n"
              "  cancel-in-progress: true\n"
          )
          new = (
              "concurrency:\n"
              f"  group: {open_expr} github.workflow {close_expr}-{open_expr} "
              "github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id "
              f"{close_expr}\n"
              f"  cancel-in-progress: {open_expr} github.event_name == 'pull_request' {close_expr}\n"
          )
          if workflow.count(old) != 1:
              raise SystemExit("expected exactly one CI concurrency block")
          workflow_path.write_text(workflow.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_ci_workflow_graph.py")
          test = test_path.read_text(encoding="utf-8")
          marker = "    def test_shared_prerequisites_run_before_parallel_fanout(self) -> None:\n"
          addition = "\n".join(
              [
                  "    def test_concurrency_only_cancels_superseded_pull_requests(self) -> None:",
                  "        concurrency = self.workflow[\"concurrency\"]",
                  "        group = str(concurrency[\"group\"])",
                  "        cancel = str(concurrency[\"cancel-in-progress\"])",
                  "        self.assertIn(\"github.event_name == 'pull_request'\", group)",
                  "        self.assertIn(\"github.event.pull_request.number\", group)",
                  "        self.assertIn(\"github.run_id\", group)",
                  "        self.assertIn(\"github.event_name == 'pull_request'\", cancel)",
                  "        self.assertNotEqual(cancel, \"true\")",
                  "",
                  "",
              ]
          )
          if test.count(marker) != 1:
              raise SystemExit("expected CI graph insertion marker exactly once")
          if "test_concurrency_only_cancels_superseded_pull_requests" in test:
              raise SystemExit("concurrency regression test already exists")
          test_path.write_text(test.replace(marker, addition + marker, 1), encoding="utf-8")
          PY
          nix develop .#test -c ruff format tests/test_ci_workflow_graph.py
          git rm .github/workflows/concurrency-once.yml
          nix develop .#test -c ruff format --check services tests scripts
          nix develop .#test -c actionlint .github/workflows/ci.yml .github/workflows/release.yml
          nix develop .#test -c python3 tests/test_ci_workflow_graph.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: preserve every main merge qualification run'
          git push origin HEAD:agent/automated-merge-releases
